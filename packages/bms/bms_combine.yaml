substitutions:
  bms_model: "Unknown"
  bms_protocol: "Unknown"

globals:
  # Last valid battery_capacity this BMS contributed to the installed total
  - id: bms${bms_id}_installed_capacity
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: bms${bms_id}_combined
    type: bool
    restore_value: no
    initial_value: "false"

# Combine once without conditions
esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(yambms${yambms_id}_var_bms_counter) += 1;
            id(yambms${yambms_id}_var_bms_models) += "${bms_model},";
            id(yambms${yambms_id}_var_bms_protocols) += "${bms_protocol},";

            // EG4 per-pack data (answered on CAN when an EG4 inverter sends 0x405).
            // Little-endian fields; see the EG4 protocol section in YamBMS_functions.md.
            id(yambms${yambms_id}_eg4_packs)[${bms_id}] = [](int group, uint8_t *m) -> bool {
              if (!id(bms${bms_id}_can_be_combined).state) return false;
              auto put16 = [m](int at, float value, float lo, float hi) {
                if (std::isnan(value)) value = 0;
                const int32_t raw = (int32_t) lroundf(std::min(std::max(value, lo), hi));
                m[at] = raw & 0xFF;
                m[at + 1] = (raw >> 8) & 0xFF;
              };
              auto put8 = [m](int at, float value, float hi) {
                if (std::isnan(value)) value = 0;
                m[at] = (uint8_t) lroundf(std::min(std::max(value, 0.0f), hi));
              };
              memset(m, 0, 8);
              switch (group) {
                case 0:  // Bytes 0-3 alarms (none sent), byte 4 pack count (set by the 0x405 answer),
                         // capacity 1 Ah, byte 7 0xC0 as a real EG4 master sends (meaning not decoded)
                  put16(5, id(bms${bms_id}_battery_capacity).state, 0, 65535);
                  m[7] = 0xC0;
                  break;
                case 1:  // Bank limits, same as 0x351 (0.1 V / 0.1 A)
                  put16(0, id(yambms${yambms_id}_requested_charge_voltage).state * 10, 0, 65535);
                  put16(2, id(yambms${yambms_id}_requested_charge_current).state * 10, 0, 65535);
                  put16(4, id(yambms${yambms_id}_requested_discharge_current).state * 10, 0, 65535);
                  put16(6, id(yambms${yambms_id}_requested_discharge_voltage).state * 10, 0, 65535);
                  break;
                case 2:  // Voltage 0.01 V, current 0.1 A signed (+ = charge), SOC %, SOH %, cycles
                  put16(0, id(bms${bms_id}_total_voltage).state * 100, 0, 65535);
                  put16(2, id(bms${bms_id}_current).state * 10, -32768, 32767);
                  put8(4, id(bms${bms_id}_battery_soc).state, 100);
                  put8(5, id(bms${bms_id}_battery_soh).state, 100);
                  put16(6, id(bms${bms_id}_charging_cycles).state, 0, 65535);
                  break;
                case 3:  // Max / min temperature 0.1 °C signed, max / min cell mV
                  put16(0, id(bms${bms_id}_max_temperature).state * 10, -32768, 32767);
                  put16(2, id(bms${bms_id}_min_temperature).state * 10, -32768, 32767);
                  put16(4, id(bms${bms_id}_max_cell_voltage).state * 1000, 0, 65535);
                  put16(6, id(bms${bms_id}_min_cell_voltage).state * 1000, 0, 65535);
                  break;
                case 4:  // Sensor / cell numbers; firmware minor, major; then FF 00
                  put8(0, id(bms${bms_id}_max_temperature_sensor).state, 255);
                  put8(1, id(bms${bms_id}_min_temperature_sensor).state, 255);
                  put8(2, id(bms${bms_id}_max_voltage_cell).state, 255);
                  put8(3, id(bms${bms_id}_min_voltage_cell).state, 255);
                  m[4] = 13;  // Firmware 2.13, as an EG4-LL on Z02T13 reports; the inverter
                  m[5] = 2;   // may ignore a pack reporting 0.0
                  m[6] = 0xFF;
                  break;
                case 5:  // Name, first half
                  memcpy(m, "Battery_", 8);
                  break;
                case 6: {  // Name, second half: "ID_NN", NUL padded
                  char name[9];
                  snprintf(name, sizeof(name), "ID_%02d", ${bms_id});
                  memcpy(m, name, strlen(name));
                  break;
                }
                default:
                  return false;
              }
              return true;
            };

binary_sensor:
  # Indicates whether the BMS can be combined
  - platform: template
    name: "Can be combined"
    id: bms${bms_id}_can_be_combined
    device_id: bms_${bms_id}
    lambda: |-
      // Ensure that the sensors have a correct value and not NAN
      if ((id(bms${bms_id}_online_status).has_state()) &&           // binary_sensor
          (id(bms${bms_id}_online_status).state) &&                 // binary_sensor
          (id(bms${bms_id}_charging_allowed).has_state()) &&        // binary_sensor
          (id(bms${bms_id}_discharging_allowed).has_state()) &&     // binary_sensor
          (id(bms${bms_id}_equalizing).has_state()) &&              // binary_sensor
          (id(bms${bms_id}_total_voltage).state > 0) &&
          (id(bms${bms_id}_current).has_state()) &&
          (id(bms${bms_id}_power).has_state()) &&
          (id(bms${bms_id}_battery_soc).has_state()) &&
          (id(bms${bms_id}_battery_soh).has_state()) &&
          (id(bms${bms_id}_battery_capacity).state > 0) &&
          (id(bms${bms_id}_battery_capacity_remaining).has_state()) &&
          (id(bms${bms_id}_charging_cycles).has_state()) &&
          (id(bms${bms_id}_max_charge_current).state > 0) &&
          (id(bms${bms_id}_max_discharge_current).state > 0) &&
          (id(bms${bms_id}_min_cell_voltage).has_state()) &&
          (id(bms${bms_id}_max_cell_voltage).has_state()) &&
          (id(bms${bms_id}_min_voltage_cell).has_state()) &&
          (id(bms${bms_id}_max_voltage_cell).has_state()) &&
          (id(bms${bms_id}_min_temperature).has_state()) &&
          (id(bms${bms_id}_max_temperature).has_state()) &&
          (id(bms${bms_id}_min_temperature_sensor).has_state()) &&
          (id(bms${bms_id}_max_temperature_sensor).has_state()) &&
          (id(bms${bms_id}_cell_ovp).has_state()) &&
          (id(bms${bms_id}_cell_uvp).has_state()) &&
          (id(bms${bms_id}_balance_trigger_voltage).has_state()) &&
          (id(bms${bms_id}_yambms_errors_bitmask).has_state()))
      {
        return true;
      }
      else return false;

interval:
  - interval: ${yambms_update_interval}
    then:
      - lambda: |-
          // +-----------------------------------------------+
          // | STEP 1 - BMS combiner                         |
          // +-----------------------------------------------+
          // BMS number to combine ?
          if (id(yambms${yambms_id}_var_to_combine_bms_number) == ${bms_id})
          {
            // The BMS can be combined ?
            if (id(bms${bms_id}_can_be_combined).state)
            {
              // +-----------------------------------------------+
              // | Installed battery capacity contribution       |
              // +-----------------------------------------------+
              // The installed total tracks a hot capacity change, but is never
              // reduced when a BMS is uncombined : an offline BMS simply stops
              // updating its contribution, which stays in the total.

              float capacity = id(bms${bms_id}_battery_capacity).state;

              if (capacity != id(bms${bms_id}_installed_capacity))
              {
                id(yambms${yambms_id}_var_total_installed_battery_capacity) += capacity - id(bms${bms_id}_installed_capacity);
                id(bms${bms_id}_installed_capacity) = capacity;
              }

              // +-----------------------------------------------+
              // | Combine not continuously                      |
              // +-----------------------------------------------+

              if (id(bms${bms_id}_combined) == false)
              {
                // To combine bms counter
                id(yambms${yambms_id}_var_to_combine_bms_counter) += 1;

                // Combined
                id(bms${bms_id}_combined) = true;
              }

              // +-----------------------------------------------+
              // | Combine continuously                          |
              // +-----------------------------------------------+

              // Online bitmask
              id(yambms${yambms_id}_var_bms_online_bitmask) |= (1 << (${bms_id} - 1));
              // Remember that we've seen this BMS online
              id(yambms${yambms_id}_var_bms_seen_online_bitmask) |= id(yambms${yambms_id}_var_bms_online_bitmask);

              // YamBMS Errors Bitmask (16bit)
              if (id(bms${bms_id}_yambms_errors_bitmask).state > 0)
              {
                uint16_t errors_bitmask = id(bms${bms_id}_yambms_errors_bitmask).state;   // errors_bitmask (16bit)
                id(yambms${yambms_id}_var_errors_bitmask) |= errors_bitmask;                    // OR bitwise
                id(yambms${yambms_id}_var_errors_bitmask_counter) += 1;                         // errors_bitmask_counter
              }

              if (id(bms${bms_id}_charging_allowed).state)
              {
                // TOTAL charging_allowed_counter
                id(yambms${yambms_id}_var_charging_allowed_counter) += 1;
                // TOTAL max_charge_current
                id(yambms${yambms_id}_var_total_max_charge_current) += id(bms${bms_id}_max_charge_current).state;
              }
              // TOTAL bms_blocking_charge_counter
              else id(yambms${yambms_id}_var_bms_blocking_charge_counter) += 1;

              if (id(bms${bms_id}_discharging_allowed).state)
              {
                // TOTAL discharging_allowed_counter
                id(yambms${yambms_id}_var_discharging_allowed_counter) += 1;
                // TOTAL max_discharge_current
                id(yambms${yambms_id}_var_total_max_discharge_current) += id(bms${bms_id}_max_discharge_current).state;
              }
              // TOTAL bms_blocking_discharge_counter
              else id(yambms${yambms_id}_var_bms_blocking_discharge_counter) += 1;

              // TOTAL total_voltage
              id(yambms${yambms_id}_var_bms_total_voltage) += id(bms${bms_id}_total_voltage).state;

              // TOTAL current
              id(yambms${yambms_id}_var_bms_total_current) += id(bms${bms_id}_current).state;

              // TOTAL power
              id(yambms${yambms_id}_var_bms_total_power) += id(bms${bms_id}_power).state;

              // TOTAL battery_capacity
              id(yambms${yambms_id}_var_total_battery_capacity) += id(bms${bms_id}_battery_capacity).state;

              // TOTAL battery_capacity_remaining
              id(yambms${yambms_id}_var_total_battery_capacity_remaining) += id(bms${bms_id}_battery_capacity_remaining).state;

              // TOTAL SoC
              // id(yambms${yambms_id}_var_bms_total_soc) += id(bms${bms_id}_battery_soc).state;

              // TOTAL SoH
              id(yambms${yambms_id}_var_bms_total_soh) += id(bms${bms_id}_battery_soh).state;

              // TOTAL charging_cycles
              id(yambms${yambms_id}_var_total_charging_cycles) += id(bms${bms_id}_charging_cycles).state;

              // TOTAL equalizing_counter
              if (id(bms${bms_id}_equalizing).state) id(yambms${yambms_id}_var_equalizing_counter) += 1;

              // MIN/MAX values
              // MAX balance_trigger_voltage
              if (id(bms${bms_id}_balance_trigger_voltage).state > id(yambms${yambms_id}_var_max_balance_trigger_voltage))
                id(yambms${yambms_id}_var_max_balance_trigger_voltage) = id(bms${bms_id}_balance_trigger_voltage).state;

              // MIN min_cell_voltage
              // MIN min_voltage_cell (cell number)
              if (id(bms${bms_id}_min_cell_voltage).state < id(yambms${yambms_id}_var_min_cell_voltage))
              {
                id(yambms${yambms_id}_var_min_cell_voltage) = id(bms${bms_id}_min_cell_voltage).state;
                id(yambms${yambms_id}_var_min_voltage_cell) = id(bms${bms_id}_min_voltage_cell).state + (${bms_id} * 100);
              }

              // MAX max_cell_voltage
              // MAX max_voltage_cell (cell number)
              if (id(bms${bms_id}_max_cell_voltage).state > id(yambms${yambms_id}_var_max_cell_voltage))
              {
                id(yambms${yambms_id}_var_max_cell_voltage) = id(bms${bms_id}_max_cell_voltage).state;
                id(yambms${yambms_id}_var_max_voltage_cell) = id(bms${bms_id}_max_voltage_cell).state + (${bms_id} * 100);
              }

              // MIN cell_ovp
              if (id(bms${bms_id}_cell_ovp).state < id(yambms${yambms_id}_var_min_cell_ovp))
                id(yambms${yambms_id}_var_min_cell_ovp) = id(bms${bms_id}_cell_ovp).state;

              // MAX cell_uvp
              if (id(bms${bms_id}_cell_uvp).state > id(yambms${yambms_id}_var_max_cell_uvp))
                id(yambms${yambms_id}_var_max_cell_uvp) = id(bms${bms_id}_cell_uvp).state;

              // MIN temperature
              // MIN temperature_sensor
              if (id(bms${bms_id}_min_temperature).state < id(yambms${yambms_id}_var_min_temperature))
              {
                id(yambms${yambms_id}_var_min_temperature) = id(bms${bms_id}_min_temperature).state;
                id(yambms${yambms_id}_var_min_temperature_sensor) = id(bms${bms_id}_min_temperature_sensor).state;
              }

              // MAX temperature
              // MAX temperature_sensor
              if (id(bms${bms_id}_max_temperature).state > id(yambms${yambms_id}_var_max_temperature))
              {
                id(yambms${yambms_id}_var_max_temperature) = id(bms${bms_id}_max_temperature).state;
                id(yambms${yambms_id}_var_max_temperature_sensor) = id(bms${bms_id}_max_temperature_sensor).state;
              }
            }

            // +-----------------------------------------------+
            // | Uncombine not continuously                    |
            // +-----------------------------------------------+
            else if (id(bms${bms_id}_combined) == true)
            {
              // To combine bms counter
              id(yambms${yambms_id}_var_to_combine_bms_counter) -= 1;

              // Uncombined
              id(bms${bms_id}_combined) = false;

              // Remove from bitmask
              id(yambms${yambms_id}_var_bms_online_bitmask) &= ~(1 << (${bms_id} - 1));
            }

            // Increment the counter for next BMS processing
            id(yambms${yambms_id}_var_to_combine_bms_number)++;
          }
