substitutions:
  # Modbus
  eg4_modbus_id: modbus_eg4

external_components:
  - source: github://RAR/esphome-eg4-bms@v1.1.2
    refresh: 0s

packages:
  eg4_uart: !include
    file: ../board/board_options_itf_${eg4_modbus_uart_id}.yaml
    vars:
      uart_baud_rate: ${eg4_modbus_baud_rate}

eg4_modbus:
  - uart_id: ${eg4_modbus_uart_id}
    id: ${eg4_modbus_id}

