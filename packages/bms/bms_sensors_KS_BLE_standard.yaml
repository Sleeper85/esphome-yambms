packages:
  bms_base: !include bms_base.yaml
  bms_temperature_sensor: !include bms_temperature_sensor_4.yaml
  bms_errors_bitmask: !include bms_errors_bitmask_KS_BLE.yaml

substitutions:
  # KS BMS device type : selects the status command the component polls with,
  # 0x01 for type 1 and 0x61 for type 2. Everything else (UUIDs, frame decoding,
  # scaling) is identical.
  #   1 = default, KS48100 and KS48300-Ho23
  #   2 = KS48200-Ho21_V2
  # Wrong value : the settings and identification frames still answer, so the
  # numbers and text sensors fill in, but every status sensor stays empty and
  # 'Can be combined' never turns on.
  bms_ks_device_type: '1'

ota:
  on_begin:
    then:
      - switch.turn_off: bms${bms_id}_enable_bluetooth_connection
      - logger.log: "BLE shutdown for flashing"

# +--------------------------------------+
# | Component settings                   |
# +--------------------------------------+

external_components:
  - source: github://syssi/esphome-ks-bms@main
    refresh: 0s

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - id: ble_client${bms_id}
    mac_address: ${bms_ble_mac_address}

ks_bms_ble:
  - id: ks_bms_ble${bms_id}
    ble_client_id: ble_client${bms_id}
    device_type: ${bms_ks_device_type}
    update_interval: ${bms_update_interval}

# +--------------------------------------+
# | Component entities                   |
# +--------------------------------------+

binary_sensor:
  - platform: ks_bms_ble
    ks_bms_ble_id: ks_bms_ble${bms_id}
    charging:
      id: bms${bms_id}_charging_allowed
      device_id: bms_${bms_id}
      name: "charging"
    discharging:
      id: bms${bms_id}_discharging_allowed
      device_id: bms_${bms_id}
      name: "discharging"
    limiting_current:
      device_id: bms_${bms_id}
      name: "limiting current"
    online_status:
      id: bms${bms_id}_online_status
      device_id: bms_${bms_id}
      name: "online status"
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              // Pass the current state to the update function
              id(global_update_fault)(${CAT_BMS}, ${bms_id}, !x);

  # Required sensors cannot be retrieved from BMS
  # equalizing : the KS BMS only reports which cells are being balanced
  # Internal : only specifying an id without a name will implicitly set this to true.
  - platform: template
    id: bms${bms_id}_bms_equalizing
    device_id: bms_${bms_id}
    lambda: return (id(bms${bms_id}_balanced_cell_bitmask).state > 0);

switch:
  - platform: ks_bms_ble
    ks_bms_ble_id: ks_bms_ble${bms_id}
    charging:
      id: bms${bms_id}_charge_switch
      device_id: bms_${bms_id}
      name: "Charge switch"
    discharging:
      id: bms${bms_id}_discharge_switch
      device_id: bms_${bms_id}
      name: "Discharge switch"
    # +--------------------------------------+
  - platform: ble_client
    ble_client_id: ble_client${bms_id}
    id: bms${bms_id}_enable_bluetooth_connection
    device_id: bms_${bms_id}
    name: "Enable Bluetooth connection"
    # +--------------------------------------+

