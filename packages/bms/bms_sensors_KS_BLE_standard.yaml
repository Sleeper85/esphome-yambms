      name: "cell voltage 05"
    cell_voltage_6:
      id: bms${bms_id}_cell_v_06
      device_id: bms_${bms_id}
      name: "cell voltage 06"
    cell_voltage_7:
      id: bms${bms_id}_cell_v_07
      device_id: bms_${bms_id}
      name: "cell voltage 07"
    cell_voltage_8:
      id: bms${bms_id}_cell_v_08
      device_id: bms_${bms_id}
      name: "cell voltage 08"
    cell_voltage_9:
      id: bms${bms_id}_cell_v_09
      device_id: bms_${bms_id}
      name: "cell voltage 09"
    cell_voltage_10:
      id: bms${bms_id}_cell_v_10
      device_id: bms_${bms_id}
      name: "cell voltage 10"
    cell_voltage_11:
      id: bms${bms_id}_cell_v_11
      device_id: bms_${bms_id}
      name: "cell voltage 11"
    cell_voltage_12:
      id: bms${bms_id}_cell_v_12
      device_id: bms_${bms_id}
      name: "cell voltage 12"
    cell_voltage_13:
      id: bms${bms_id}_cell_v_13
      device_id: bms_${bms_id}
      name: "cell voltage 13"
    cell_voltage_14:
      id: bms${bms_id}_cell_v_14
