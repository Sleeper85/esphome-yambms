      name: "nominal capacity"
    charging_cycles:
      id: bms${bms_id}_charging_cycles_raw
      device_id: bms_${bms_id}
      # name: "charging cycles"
    balanced_cell:
      device_id: bms_${bms_id}
      name: "balanced cell"
    balanced_cell_bitmask:
      id: bms${bms_id}_balanced_cell_bitmask
      device_id: bms_${bms_id}
      name: "balanced cell bitmask"
    error_bitmask:
      id: bms${bms_id}_errors_bitmask
      device_id: bms_${bms_id}
      name: "errors bitmask"
    voltage_protection_bitmask:
      device_id: bms_${bms_id}
      name: "voltage protection bitmask"
    current_protection_bitmask:
      device_id: bms_${bms_id}
      name: "current protection bitmask"
    temperature_protection_bitmask:
      device_id: bms_${bms_id}
      name: "temperature protection bitmask"
    cell_voltage_1:
      id: bms${bms_id}_cell_v_01
