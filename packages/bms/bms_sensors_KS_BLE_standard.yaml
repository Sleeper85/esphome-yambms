    cell_voltage_16:
      id: bms${bms_id}_cell_v_16
      device_id: bms_${bms_id}
      name: "cell voltage 16"

  # Charging cycle capacity - Calculated from charging cycles and battery capacity
  - platform: template
    id: bms${bms_id}_cycle_capacity_raw
    device_id: bms_${bms_id}
    # name: "charging cycle capacity"
    update_interval: ${bms_update_interval}
    unit_of_measurement: Ah
    state_class: total
    icon: mdi:car-battery
    accuracy_decimals: 0
    filters:
      - or:
        - throttle: 10s
        - delta: 1
    lambda: return id(bms${bms_id}_charging_cycles_raw).state * id(bms${bms_id}_battery_capacity).state;

number:
  - platform: ks_bms_ble
    ks_bms_ble_id: ks_bms_ble${bms_id}
    cell_overvoltage_protection:
      id: bms${bms_id}_cell_ovp
      device_id: bms_${bms_id}
      name: "cell voltage overvoltage protection"
    cell_overvoltage_recovery:
      id: bms${bms_id}_cell_ovpr
      device_id: bms_${bms_id}
      name: "cell voltage overvoltage recovery"
    cell_undervoltage_protection:
      id: bms${bms_id}_cell_uvp
      device_id: bms_${bms_id}
      name: "cell voltage undervoltage protection"
    cell_undervoltage_recovery:
      id: bms${bms_id}_cell_uvpr
      device_id: bms_${bms_id}
      name: "cell voltage undervoltage recovery"
    balance_open_voltage:
      id: bms${bms_id}_balance_starting_voltage
      device_id: bms_${bms_id}
      name: "balancing start voltage"
    balance_open_voltage_diff:
      id: bms${bms_id}_bms_balance_trigger_voltage
      device_id: bms_${bms_id}
      # name: "balance trigger voltage"
    cell_full_voltage:
      device_id: bms_${bms_id}
      name: "cell full voltage"
    cell_cutoff_voltage:
      device_id: bms_${bms_id}
      name: "cell cutoff voltage"
    nominal_capacity:
      device_id: bms_${bms_id}
      name: "nominal capacity setting"
    full_charge_capacity:
      device_id: bms_${bms_id}
      name: "full charge capacity setting"
    # The KS BMS has no dedicated charge / discharge current limit setting,
    # its overcurrent protection thresholds are what YamBMS reads as the
    # maximum charge and discharge currents of the pack.
    charge_overcurrent_protection:
      id: bms${bms_id}_max_charge_current
      device_id: bms_${bms_id}
      name: "max charge current"
    discharge_overcurrent_protection:
      id: bms${bms_id}_max_discharge_current
      device_id: bms_${bms_id}
      name: "max discharge current"
    charge_overtemperature_protection:
      device_id: bms_${bms_id}
      name: "charge overtemperature protection"
    charge_overtemperature_recovery:
      device_id: bms_${bms_id}
      name: "charge overtemperature recovery"
    charge_undertemperature_protection:
      device_id: bms_${bms_id}
      name: "charge undertemperature protection"
    charge_undertemperature_recovery:
      device_id: bms_${bms_id}
      name: "charge undertemperature recovery"
    discharge_overtemperature_protection:
      device_id: bms_${bms_id}
      name: "discharge overtemperature protection"
    discharge_overtemperature_recovery:
      device_id: bms_${bms_id}
      name: "discharge overtemperature recovery"
    discharge_undertemperature_protection:
      device_id: bms_${bms_id}
      name: "discharge undertemperature protection"
    discharge_undertemperature_recovery:
      device_id: bms_${bms_id}
      name: "discharge undertemperature recovery"

text_sensor:
  - platform: ks_bms_ble
    ks_bms_ble_id: ks_bms_ble${bms_id}
    errors:
      device_id: bms_${bms_id}
      name: "errors"
    voltage_protection:
      device_id: bms_${bms_id}
      name: "voltage protection"
    current_protection:
      device_id: bms_${bms_id}
      name: "current protection"
    temperature_protection:
      device_id: bms_${bms_id}
      name: "temperature protection"
    balancer_status:
      device_id: bms_${bms_id}
      name: "balancer status"
    # The BLE advertised name identifies the bluetooth module, not the BMS.
    # 'model type' and 'device model' are what tell you which pack you have,
    # and so whether bms_ks_device_type should be 1 or 2.
    device_model:
      device_id: bms_${bms_id}
      name: "device model"
    model_type:
      device_id: bms_${bms_id}
      name: "model type"
    serial_number:
      device_id: bms_${bms_id}
      name: "serial number"
    software_version:
      device_id: bms_${bms_id}
      name: "software version"
    hardware_version:
      device_id: bms_${bms_id}
      name: "hardware version"
