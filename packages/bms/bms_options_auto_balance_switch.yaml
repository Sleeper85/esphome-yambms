# Turns the BMS balance switch on above ${bms_top_v} or below ${bms_bot_v} (max/min cell voltage).
# Do not combine with the Auto Balancer (bms_options_auto_balancer_switch.yaml) on the same switch,
# both would fight over bms${bms_id}_balance_switch.

interval:
  - interval: ${bms_update_interval}
    then:
      - lambda: |-
          if (id(bms${bms_id}_max_cell_voltage).state > ${bms_top_v})
            id(bms${bms_id}_balance_switch).turn_on();
          else if (id(bms${bms_id}_min_cell_voltage).state < ${bms_bot_v})
            id(bms${bms_id}_balance_switch).turn_on();
          else id(bms${bms_id}_balance_switch).turn_off();
