substitutions:
  # BMS
  bms_model: "PACE"
  bms_protocol: "RS485"
  # Modbus
  pace_modbus_id: modbus_pace
  pace_modbus_send_wait_time: 250ms    # Timeout: max time to wait for the FIRST byte of a response
  pace_modbus_turnaround_time: '0ms'   # Pause after a completed response before the next command.
  # Modbus Controller
  pace_modbus_update_interval: '5s'    # Frequency with which BMS modbus servers are queried

uart:
  - id: !extend ${pace_modbus_uart_id}
    baud_rate: ${pace_modbus_baud_rate}

modbus:
  - uart_id: ${pace_modbus_uart_id}
    id: ${pace_modbus_id}
    role: client
    send_wait_time: ${pace_modbus_send_wait_time}
    turnaround_time: ${pace_modbus_turnaround_time}
