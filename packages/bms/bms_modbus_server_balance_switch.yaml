# Exposes the BMS internal balance switch on the BMS modbus server.
# Requires a BMS package that provides the switch bms${bms_id}_balance_switch.
# The main YamBMS node uses bms_combine_modbus_client_balance_switch.yaml to control it.

modbus_server:
  - id: !extend modbus_server_bms${bms_id}
    registers:
        # balance_switch (1/0) - writable
        - address: 35
          value_type: U_WORD
          read_lambda: |-
            return uint16_t(id(bms${bms_id}_balance_switch).state);
          write_lambda: |-
            if (x > 1) return false;
            if (x == 1) id(bms${bms_id}_balance_switch).turn_on();
            else id(bms${bms_id}_balance_switch).turn_off();
            return true;
