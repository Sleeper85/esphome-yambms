substitutions:
  # Seplos Parser
  seplos_parser_id: seplos_parser_1

# +--------------------------------------+
# | Component settings                   |
# +--------------------------------------+

external_components:
  - source:
      type: git
      url: https://github.com/DpunktS/seplos_v3_sniffer

packages:
  seplos_uart: !include
    file: ../board/board_options_itf_${seplos_uart_id}.yaml
    vars:
      uart_baud_rate: ${seplos_baud_rate}
      uart_rx_buffer_size: '2048'

seplos_parser:
  id: ${seplos_parser_id}
  uart_id: ${seplos_uart_id}
  bms_count: ${seplos_bms_count}
  update_interval: ${seplos_update_interval}
