# For MQTT and Prometheus users with several BMS / shunts / balancers.
#
# Since YamBMS 1.6.0 each BMS is an ESPHome sub-device and its entities no longer
# carry the BMS name. Home Assistant (native API) is not affected, but ESPHome
# builds MQTT topics and Prometheus labels from the entity name only, so every BMS
# publishes to the same topic, e.g. `yambms/sensor/charging_power/state`.
#
# This package prefixes them with the sub-device name :
#   MQTT       : yambms/sensor/bms_1_charging_power/state (and /command)
#   Prometheus : id="bms_1_charging_power", name="BMS 1 Charging Power"
#
# See documents/README/MQTT_and_Prometheus.md

external_components:
  - source: github://Sleeper85/esphome-yambms@main
    components: [ yambms_sub_device_topics ]
    refresh: 60min

yambms_sub_device_topics:
  mqtt: true       # Prefix MQTT state/command topics (only if `mqtt:` is configured)
  prometheus: true # Prefix Prometheus `id` and `name` labels (only if `prometheus:` is configured)
