substitutions:
  canbus_status_led_id: "virtual_status_light" # The ID of the LED on your board used for this component
  canbus_link_timer_enabled: 'true' # Set it to 'false' if your inverter/charger is not sending ACK (can_id 0x305) every `1s` as specified by the protocol

esphome:
  on_boot:
    - priority: 600.0
      then:
        - lambda: |-
            // Register System
            id(global_register_led)(${CAT_INV_CAN_BUS}, ${canbus_id}, id(${canbus_status_led_id}));
            // Force register fault as default, will be updated once CANBUS is working
            // (true = fault)
            id(global_update_fault)(${CAT_INV_CAN_BUS}, ${canbus_id}, true);          
    - priority: -100.0
      then:
        - lambda: |-
            // Increment the interface counter for the `requested current` division
            id(yambms${yambms_id}_var_comm_interfaces_count)++;

            // Initialise CANBUS status as off
            id(canbus${canbus_id}_status).publish_state(false);

            // Reserve this link's telemetry slot. The four vectors are always
            // grown together so that the n-th element of each describes this link.
            id(canbus${canbus_id}_link_slot) = id(yambms${yambms_id}_var_inverter_brands).size();
            id(yambms${yambms_id}_var_inverter_brands).push_back("Not defined");
            id(yambms${yambms_id}_var_inverter_buses).push_back("CAN");
            id(yambms${yambms_id}_var_inverter_protocols).push_back("None");
            id(yambms${yambms_id}_var_inverter_protocol_sources).push_back("auto");

            // From here the slot exists and every component is set up
            id(canbus${canbus_id}_link_ready) = true;
        - script.execute: canbus${canbus_id}_script_resolve_protocol
            
  devices:
    - id: canbus_${canbus_id}
      name: "${yambms_name} ${canbus_name}"

globals:
  - id: canbus${canbus_id}_send_canbus_data
    type: bool
    restore_value: no
    initial_value: "false"
  # Protocol actually applied on this link, resolved from the `Protocol` select
  # and, when it is on `Automatic`, from the `Inverter brand` select. Holds a
  # YB_PROTO_* constant, never a select index.
  - id: canbus${canbus_id}_active_protocol
    type: int
    restore_value: no
    initial_value: "${YB_PROTO_NONE}"
  # Index of this link in the yambms inverter telemetry vectors
  - id: canbus${canbus_id}_link_slot
    type: int
    restore_value: no
    initial_value: "0"
  # False until the telemetry slot has been reserved at on_boot priority -100.
  # The selects are set up at HARDWARE priority (800) and their on_value fires
  # during setup, long before that: without this flag the resolution script
  # would index an empty vector and the device would crash on every boot.
  - id: canbus${canbus_id}_link_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: canbus${canbus_id}_can_frame
    type: int
    restore_value: no
    initial_value: "0"
  - id: canbus${canbus_id}_can_frame_index
    type: int
    restore_value: no
    initial_value: "-1"
  - id: canbus${canbus_id}_inverter_ack_ms_previous
    type: uint32_t
    restore_value: no
    initial_value: "0"

select:
  # Inverter brand. On its own it drives nothing: it selects the default
  # protocol applied when `Protocol` is on `Automatic`, and it provides the
  # battery mode and the installation note. New brands must be appended at the
  # END of this list: the restored preference is an index, so inserting one in
  # the middle would silently shift every user's saved choice.
  - platform: template
    name: "Inverter brand"
    id: canbus${canbus_id}_inverter_brand
    device_id: canbus_${canbus_id}
    options:
      - "Not defined"
      - "Other"
      - "Deye"
      - "EG4"
      - "Epever"
      - "GoodWe"
      - "Growatt"
      - "LuxPower"
      - "MidNite Solar"
      - "Schneider"
      - "SMA"
      - "Sofar"
      - "Solis"
      - "SRNE"
      - "Studer"
      - "Victron"
    restore_value: true
    initial_option: "Not defined"
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: canbus${canbus_id}_script_resolve_protocol
  # Communication protocol. `Automatic` derives it from the inverter brand;
  # any other choice takes priority over the brand.
  - platform: template
    name: "Protocol"
    id: canbus${canbus_id}_protocol
    device_id: canbus_${canbus_id}
    options:
      - "Automatic"
      - "Disabled"
      - "PYLON V1"
      - "PYLON V2"
      - "SMA"
      - "Victron"
      - "LuxPower"
      # - "Deye PCS (beta)"
    restore_value: true
    initial_option: "Automatic"
    optimistic: true
    entity_category: config
    on_value:
      - script.execute: canbus${canbus_id}_script_resolve_protocol

text_sensor:
  # What this link is actually doing, for the dashboard markdown card
  - platform: template
    name: "Inverter link protocol"
    id: canbus${canbus_id}_inverter_link_protocol
    device_id: canbus_${canbus_id}
    icon: mdi:transit-connection-variant
    entity_category: diagnostic
  # How the battery type must be configured on the inverter itself
  - platform: template
    name: "Inverter battery mode"
    id: canbus${canbus_id}_inverter_battery_mode
    device_id: canbus_${canbus_id}
    icon: mdi:cog-outline
    entity_category: diagnostic
  # What is specific to this brand / protocol couple, when there is anything
  - platform: template
    name: "Note"
    id: canbus${canbus_id}_note
    device_id: canbus_${canbus_id}
    icon: mdi:information-outline
    entity_category: diagnostic

# +--------------------------------------+
# | Sensors                              |
# +--------------------------------------+
switch:
  - platform: template
    name: "Inverter Heartbeat Monitoring"
    id: canbus${canbus_id}_switch_inverter_heartbeat_monitoring
    device_id: canbus_${canbus_id}
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: diagnostic

sensor:
  # 0x305 Inverter ACK interval
  - platform: template
    id: canbus${canbus_id}_inverter_heartbeat
    device_id: canbus_${canbus_id}
    name: "Inverter Heartbeat"
    unit_of_measurement: ms
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:update
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: canbus${canbus_id}_status
    device_id: canbus_${canbus_id}
    name: "Status"
    entity_category: diagnostic
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            // A link the user turned off is neither healthy nor faulty: it is not
            // expected to communicate, so it must not light the fault LED.
            if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_DISABLED}) {
              id(global_unregister_fault)(${CAT_INV_CAN_BUS}, ${canbus_id});
              return;
            }
            // Pass the current state to the update function
            id(global_update_fault)(${CAT_INV_CAN_BUS}, ${canbus_id}, !x);

# +--------------------------------------+
# | Scripts                              |
# +--------------------------------------+
script:
  # Resolves the protocol actually applied on this link, publishes the three
  # diagnostic text sensors and refreshes this link's telemetry slot.
  # Runs once at boot and on every change of either select, never in the loop:
  # everything else only reads `canbus${canbus_id}_active_protocol`.
  - id: canbus${canbus_id}_script_resolve_protocol
    mode: restart
    then:
      - lambda: |-
          // Not before the telemetry slot exists: the selects fire on_value while
          // they are being set up, which is well before on_boot priority -100.
          if (!id(canbus${canbus_id}_link_ready)) return;

          // Both selects must have restored their state before resolving
          if (!id(canbus${canbus_id}_inverter_brand).has_state() ||
              !id(canbus${canbus_id}_protocol).has_state()) return;

          std::string brand = id(canbus${canbus_id}_inverter_brand).current_option();
          std::string choice = id(canbus${canbus_id}_protocol).current_option();
          std::string source;
          int proto;

          // An explicit protocol always takes priority over the brand
          if (choice == "Automatic") {
            proto = id(global_inverter_default_protocol)(brand, "CAN");
            source = "auto";
          } else {
            source = "manual";
            if (choice == "Disabled")             proto = ${YB_PROTO_DISABLED};
            else if (choice == "PYLON V1")        proto = ${YB_PROTO_CAN_PYLON_V1};
            else if (choice == "PYLON V2")        proto = ${YB_PROTO_CAN_PYLON_V2};
            else if (choice == "SMA")             proto = ${YB_PROTO_CAN_SMA};
            else if (choice == "Victron")         proto = ${YB_PROTO_CAN_VICTRON};
            else if (choice == "LuxPower")        proto = ${YB_PROTO_CAN_LUXPOWER};
            else if (choice == "Deye PCS (beta)") proto = ${YB_PROTO_CAN_DEYE_PCS};
            else                                  proto = ${YB_PROTO_NONE};
          }

          id(canbus${canbus_id}_active_protocol) = proto;

          std::string label = id(global_inverter_protocol_label)(proto);

          // --- Diagnostics ---
          if (proto == ${YB_PROTO_NONE}) {
            id(canbus${canbus_id}_inverter_link_protocol).publish_state("Inverter CAN bus not defined");
            ESP_LOGW("canbus", "No inverter brand selected and no protocol forced: nothing is sent on the CAN bus");
          } else {
            id(canbus${canbus_id}_inverter_link_protocol).publish_state(brand + " - CAN " + label);
          }

          if (proto == ${YB_PROTO_NONE} || proto == ${YB_PROTO_DISABLED}) {
            id(canbus${canbus_id}_inverter_battery_mode).publish_state("");
            id(canbus${canbus_id}_note).publish_state("");
          } else {
            id(canbus${canbus_id}_inverter_battery_mode).publish_state(id(global_inverter_battery_mode)(brand, proto));
            id(canbus${canbus_id}_note).publish_state(id(global_inverter_note)(brand, proto));
          }

          // --- Restart the link now ---
          // The 30s retry interval only relaunches a stopped link on its next tick,
          // so without this a protocol change would take up to 30s to take effect.
          // Nothing here can start a bus that is not answering: the link timer still
          // stops the frames if no ACK comes back.
          if (proto != ${YB_PROTO_NONE} && proto != ${YB_PROTO_DISABLED}) {
            id(canbus${canbus_id}_send_canbus_data) = true;
            id(canbus${canbus_id}_script_canbus_link_timer).execute();
          } else {
            id(canbus${canbus_id}_send_canbus_data) = false;
          }

          // --- Fault registry ---
          // Disabled is a deliberate choice, not a failure: the link is unregistered
          // so it stops driving the status LED. Any other protocol hands control back
          // to the status binary sensor, whose current value is reapplied here so the
          // transition is correct in both directions.
          if (proto == ${YB_PROTO_DISABLED}) {
            id(global_unregister_fault)(${CAT_INV_CAN_BUS}, ${canbus_id});
          } else if (id(canbus${canbus_id}_status).has_state()) {
            id(global_update_fault)(${CAT_INV_CAN_BUS}, ${canbus_id}, !id(canbus${canbus_id}_status).state);
          }

          // --- Telemetry slot ---
          int slot = id(canbus${canbus_id}_link_slot);
          id(yambms${yambms_id}_var_inverter_brands)[slot] = brand;
          id(yambms${yambms_id}_var_inverter_buses)[slot] = "CAN";
          id(yambms${yambms_id}_var_inverter_protocols)[slot] = label;
          id(yambms${yambms_id}_var_inverter_protocol_sources)[slot] = source;

          ESP_LOGI("canbus", "Inverter link resolved: %s - CAN - %s (%s)", brand.c_str(), label.c_str(), source.c_str());

  # Inverter ACK (can_id 0x305) handler, shared by the standard and the
  # extended trigger below so that the logic is not duplicated.
  - id: canbus${canbus_id}_script_inverter_ack
    mode: single
    then:
          - lambda: |-
              ESP_LOGI("canbus", "The CAN bus is active... (received can_id 0x305)");
              
              id(canbus${canbus_id}_script_canbus_link_timer).execute();           // Restart CANBUS link timer

              if (id(canbus${canbus_id}_status).state == false)
              {
                id(canbus${canbus_id}_send_canbus_data) = true;                    // Sending CANBUS frames allowed
                id(canbus${canbus_id}_status).publish_state(true);                 // Set CANBUS status to ON
                id(inverter_com_status).publish_state(true);                       // Set Inverter com. status to ON
              }

              // Inverter ACK interval
              if (id(canbus${canbus_id}_switch_inverter_heartbeat_monitoring).state)
              {
                uint32_t inverter_ack_ms_current = millis();
                uint32_t inverter_ack_interval_ms = (inverter_ack_ms_current - id(canbus${canbus_id}_inverter_ack_ms_previous));
                id(canbus${canbus_id}_inverter_ack_ms_previous) = inverter_ack_ms_current;
                id(canbus${canbus_id}_inverter_heartbeat).publish_state(inverter_ack_interval_ms);
                ESP_LOGI("canbus", "received can_id: 0x305 ack_interval %" PRIu32 " ms", inverter_ack_interval_ms);
              }

  - id: canbus${canbus_id}_script_canbus_link_timer
    mode: restart
    then:
      - delay: ${canbus_link_timer}
      - lambda: |-
          if (${canbus_link_timer_enabled} == true)
          {
            id(canbus${canbus_id}_send_canbus_data) = false;                  // Stop sending CANBUS frames
            id(canbus${canbus_id}_status).publish_state(false);               // Set CANBUS status to OFF
            id(inverter_com_status).publish_state(false);                     // Set Inverter com. status to OFF
          }

# +--------------------------------------+
# | Start CAN Handling                   |
# +--------------------------------------+

canbus:
  # 0x305 - Inverter ACK - SMA/LG/Pylon/Goodwe reply
  - id: !extend ${canbus_node_id}
    on_frame:
      # Both the 11-bit and the 29-bit ACK are registered. The canbus component
      # matches a trigger on can_id AND use_extended_id, so only the one that
      # corresponds to the received frame fires. This makes the extended ACK
      # (Schneider XW Pro) work with no configuration at all.
      - can_id: 0x305
        use_extended_id: false
        then:
          - script.execute: canbus${canbus_id}_script_inverter_ack
      - can_id: 0x305
        use_extended_id: true
        then:
          - script.execute: canbus${canbus_id}_script_inverter_ack

interval:
  - interval: 30s
    then:
      - lambda: |-
          // Test inverter 0x305 ACK
          if (id(canbus${canbus_id}_send_canbus_data) == false && id(yambms${yambms_id}_var_initialized) == true)
          {
            id(canbus${canbus_id}_send_canbus_data) = true;                      // Sending CANBUS frames allowed
            id(canbus${canbus_id}_script_canbus_link_timer).execute();           // Restart CANBUS link timer
            ESP_LOGD("yambms_debug", "CAN bus starting...");
          }

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
              if ((id(canbus${canbus_id}_send_canbus_data) == true) &&
                  (id(yambms${yambms_id}_var_initialized) == true) &&
                  (id(yambms${yambms_id}_bms_combined).state > 0) &&
                  (id(canbus${canbus_id}_active_protocol) != ${YB_PROTO_NONE}) &&
                  (id(canbus${canbus_id}_active_protocol) != ${YB_PROTO_DISABLED}))
              {
                int index = id(canbus${canbus_id}_can_frame_index);

                // PYLON V1 / LuxPower CAN frames
                if ((id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_PYLON_V1}) || (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_LUXPOWER}))
                {
                    int can_frame[] = {1, 2, 3, 4, 5, 6};
                    int max_index = sizeof(can_frame) / sizeof(can_frame[0]) - 1;
                    if (index >= max_index) index = 0;
                    else index++;
                    id(canbus${canbus_id}_can_frame) = can_frame[index];
                }
                // PYLON V2 CAN frames
                else if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_PYLON_V2})
                {
                    int can_frame[] = {1, 2, 3, 4, 5, 6, 7, 12, 13, 14, 15, 16, 17, 19};
                    int max_index = sizeof(can_frame) / sizeof(can_frame[0]) - 1;
                    if (index >= max_index) index = 0;
                    else index++;
                    id(canbus${canbus_id}_can_frame) = can_frame[index];
                }
                // SMA CAN frames
                else if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_SMA})
                {
                    int can_frame[] = {1, 2, 3, 4, 7, 8};
                    int max_index = sizeof(can_frame) / sizeof(can_frame[0]) - 1;
                    if (index >= max_index) index = 0;
                    else index++;
                    id(canbus${canbus_id}_can_frame) = can_frame[index];
                }
                // Victron CAN frames
                else if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_VICTRON})
                {
                    int can_frame[] = {1, 2, 3, 4, 7, 8, 12, 13, 14, 15, 16, 17, 19, 22, 23};
                    int max_index = sizeof(can_frame) / sizeof(can_frame[0]) - 1;
                    if (index >= max_index) index = 0;
                    else index++;
                    id(canbus${canbus_id}_can_frame) = can_frame[index];
                }
                // Deye PCS CAN frames
                else if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_DEYE_PCS})
                {
                    int can_frame[] = {1, 2, 3, 4, 6, 24, 25, 26, 27, 28};
                    int max_index = sizeof(can_frame) / sizeof(can_frame[0]) - 1;
                    if (index >= max_index) index = 0;
                    else index++;
                    id(canbus${canbus_id}_can_frame) = can_frame[index];
                }

                id(canbus${canbus_id}_can_frame_index) = index;
                return true;
              }
              else return false;

          then:
            - if: # 0x35E - Manufacturer name
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 1;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35E
                      data: !lambda |-
                        // The manufacturer name announced on the bus is a function of the
                        // resolved protocol. These are the names the `Automatic` mode has
                        // always sent, and they are known to work; there is no separate
                        // name select any more.
                        switch (id(canbus${canbus_id}_active_protocol))
                        {
                          case ${YB_PROTO_CAN_PYLON_V1}:
                          case ${YB_PROTO_CAN_PYLON_V2}:
                            ESP_LOGD("canbus_debug", "send can_id: 0x35E ASCII : PYLON");
                            return {0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20}; // PYLON (recognized by Deye, add SOH info)

                          case ${YB_PROTO_CAN_SMA}:
                            ESP_LOGD("canbus_debug", "send can_id: 0x35E ASCII : SMA");
                            return {0x53, 0x4D, 0x41, 0x20, 0x20, 0x20, 0x20, 0x20}; // SMA

                          case ${YB_PROTO_CAN_DEYE_PCS}:
                            ESP_LOGD("canbus_debug", "send can_id: 0x35E ASCII : Deye PCS infos");
                            // Byte [00:01]    : BMS name (ASCII) [DY]
                            // Byte [02:03:04] : Battery pack number (ASCII) [001]
                            // Byte [05]       : Battery manufacturer [1:GOTION 96Ah, 2:CATL 100Ah, 3:EVE 100Ah, 4:PH 100Ah, 5:EVE 120Ah, 6:PH 100Ah(214R), 7:ZENERGY 104Ah]
                            // Byte [06:07]    : System battery nominal capacity (0.1Ah)
                            // Deye BAT SE-G5.1 Pro-B (EVE 100Ah) reply :
                            return {0x44, 0x59, 0x30, 0x30, 0x31, 0x03, 0xE8, 0x03}; // Deye PCS

                          // Victron and LuxPower : YamBMS
                          default:
                            ESP_LOGD("canbus_debug", "send can_id: 0x35E ASCII : YamBMS");
                            return {0x59, 0x61, 0x6D, 0x42, 0x4D, 0x53, 0x00, 0x00}; // YamBMS
                        }

            - if: # 0x351 - BMS instruction : Charge Volts, Charge Amps, Discharge Amps, Min voltage
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 2;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x351
                      data: !lambda |-
                        // Byte [00:01] = CVL : Charge Limit Voltage        (0.1 V)
                        // Byte [02:03] = CCL : Charge Limit Current        (0.1 A)
                        // Byte [04:05] = DCL : Discharge Limit Current     (0.1 A)
                        // Byte [06:07] = DVL : Discharge Limit Voltage     (0.1 V)     (SMA)

                        uint8_t can_mesg[8];

                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_requested_charge_voltage).state * 10) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_requested_charge_voltage).state * 10) >> 8 & 0xff;
                        can_mesg[2] = uint16_t(id(yambms${yambms_id}_requested_charge_current).state * 10) & 0xff;
                        can_mesg[3] = uint16_t(id(yambms${yambms_id}_requested_charge_current).state * 10) >> 8 & 0xff;
                        can_mesg[4] = uint16_t(id(yambms${yambms_id}_requested_discharge_current).state * 10) & 0xff;
                        can_mesg[5] = uint16_t(id(yambms${yambms_id}_requested_discharge_current).state * 10) >> 8 & 0xff;
                        can_mesg[6] = uint16_t(id(yambms${yambms_id}_requested_discharge_voltage).state * 10) & 0xff;
                        can_mesg[7] = uint16_t(id(yambms${yambms_id}_requested_discharge_voltage).state * 10) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x351 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x355 - Actual State of Charge (SOC), State of Health (SOH), Remaining total capacity
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 3;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x355
                      data: !lambda |-
                        // Byte [00:01] : State of Charge (SOC)    (1 %)
                        // Byte [02:03] : State of Health (SOH)    (1 %)
                        // Byte [04:05] : SOC high resolution      (0.01 %)     (SMA)
                        // Byte [06:07] : Remaining total capacity (1 Ah)       (Sofar)

                        uint8_t can_mesg[8];

                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_battery_soc).state) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_battery_soc).state) >> 8 & 0xff;
                        can_mesg[2] = uint16_t(id(yambms${yambms_id}_battery_soh).state) & 0xff;
                        can_mesg[3] = uint16_t(id(yambms${yambms_id}_battery_soh).state) >> 8 & 0xff;
                        can_mesg[4] = uint16_t(id(yambms${yambms_id}_battery_soc).state * 100) & 0xff;
                        can_mesg[5] = uint16_t(id(yambms${yambms_id}_battery_soc).state * 100) >> 8 & 0xff;
                        can_mesg[6] = uint16_t(id(yambms${yambms_id}_battery_capacity_remaining).state * 10) & 0xff;
                        can_mesg[7] = uint16_t(id(yambms${yambms_id}_battery_capacity_remaining).state * 10) >> 8 & 0xff;

                        // LuxPower
                        // Byte [04:05] : Max Cell Voltage         (1 mV)
                        // Byte [06:07] : Min Cell voltage         (1 mV)

                        if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_LUXPOWER}) {
                          int min_cell_voltage_i = id(yambms${yambms_id}_min_cell_voltage).state * 1000.0;
                          int max_cell_voltage_i = id(yambms${yambms_id}_max_cell_voltage).state * 1000.0;
                          can_mesg[4] = max_cell_voltage_i & 0xff;
                          can_mesg[5] = max_cell_voltage_i >> 8 & 0xff;
                          can_mesg[6] = min_cell_voltage_i & 0xff;
                          can_mesg[7] = min_cell_voltage_i >> 8 & 0xff;
                        }

                        ESP_LOGD("canbus_debug", "send can_id: 0x355 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x356 - Actual Voltage / Current / Temperature / Cycles (Deye 0x305 ACK)
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 4;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x356
                      data: !lambda |-
                        // Byte [00:01] : Actual Voltage           (0.01 V)
                        // Byte [02:03] : Actual Current           (0.1 A)
                        // Byte [04:05] : Actual Temperature       (0.1 °C)
                        // Byte [06:07] : Actual Cycles number     (1 cycle)     (Sofar)

                        uint8_t can_mesg[8];

                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_total_voltage).state * 100) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_total_voltage).state * 100) >> 8 & 0xff;
                        can_mesg[2] = int16_t(id(yambms${yambms_id}_current).state * 10) & 0xff;
                        can_mesg[3] = int16_t(id(yambms${yambms_id}_current).state * 10) >> 8 & 0xff;
                        can_mesg[4] = int16_t(((id(yambms${yambms_id}_min_temperature).state + id(yambms${yambms_id}_max_temperature).state) / 2) * 10) & 0xff;
                        can_mesg[5] = int16_t(((id(yambms${yambms_id}_min_temperature).state + id(yambms${yambms_id}_max_temperature).state) / 2) * 10) >> 8 & 0xff;
                        can_mesg[6] = uint16_t(id(yambms${yambms_id}_charging_cycles).state) & 0xff;
                        can_mesg[7] = uint16_t(id(yambms${yambms_id}_charging_cycles).state) >> 8 & 0xff;

                        // LuxPower
                        // Byte [04:05] : Max cell temperature     (0.1 °C)
                        // Byte [06:07] : Min cell temperature     (0.1 °C)

                        if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_LUXPOWER})
                        {
                          // Added 0.1 °C safeguard to max temperature so that max and min values are never equal
                          can_mesg[4] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) & 0xff;
                          can_mesg[5] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) >> 8 & 0xff;
                          can_mesg[6] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) & 0xff;
                          can_mesg[7] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) >> 8 & 0xff;
                        }

                        ESP_LOGD("canbus_debug", "send can_id: 0x356 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x359 - Protection Alarms, Warning and Flags ( PYLON / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 5;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x359
                      data: !lambda |-
                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        uint16_t errors_bitmask_alarm = id(yambms${yambms_id}_errors_bitmask_alarm).state;
                        uint16_t errors_bitmask_warning = id(yambms${yambms_id}_errors_bitmask_warning).state;

                        // +---------------------------+
                        // | Alarm : byte 0 and 1      |
                        // +---------------------------+

                        // YamBMS alarm ?
                        if (errors_bitmask_alarm > 0)
                        {
                          if (errors_bitmask_alarm & 0x0002) can_mesg[0] |= 0x02;    // Over Voltage Protection
                          if (errors_bitmask_alarm & 0x0004) can_mesg[0] |= 0x04;    // Under Voltage Protection
                          if (errors_bitmask_alarm & 0x0008) can_mesg[0] |= 0x08;    // Over Temp Protection
                          if (errors_bitmask_alarm & 0x0020) can_mesg[0] |= 0x08;    // Charge Over Temp Protection
                          if (errors_bitmask_alarm & 0x0010) can_mesg[0] |= 0x10;    // Under Temp Protection
                          if (errors_bitmask_alarm & 0x0040) can_mesg[0] |= 0x10;    // Charge Under Temp Protection
                          if (errors_bitmask_alarm & 0x0080) can_mesg[0] |= 0x80;    // Discharge Over Current Protection
                          if (errors_bitmask_alarm & 0x0100) can_mesg[1] |= 0x80;    // Charge Over Current Protection
                          if (errors_bitmask_alarm & 0x0800) can_mesg[1] |= 0x08;    // BMS Internal Error
                          if (errors_bitmask_alarm & 0x1000) can_mesg[1] |= 0x10;    // UnBalanced Cell
                        }

                        // +---------------------------+
                        // | Warning : byte 2 and 3    |
                        // +---------------------------+

                        // YamBMS warning ?
                        if (errors_bitmask_warning > 0)
                        {
                          if (errors_bitmask_warning & 0x0002) can_mesg[2] |= 0x02;    // Over Voltage Protection
                          if (errors_bitmask_warning & 0x0004) can_mesg[2] |= 0x04;    // Under Voltage Protection
                          if (errors_bitmask_warning & 0x0008) can_mesg[2] |= 0x08;    // Over Temp Protection
                          if (errors_bitmask_warning & 0x0020) can_mesg[2] |= 0x08;    // Charge Over Temp Protection
                          if (errors_bitmask_warning & 0x0010) can_mesg[2] |= 0x10;    // Under Temp Protection
                          if (errors_bitmask_warning & 0x0040) can_mesg[2] |= 0x10;    // Charge Under Temp Protection
                          if (errors_bitmask_warning & 0x0080) can_mesg[2] |= 0x80;    // Discharge Over Current Protection
                          if (errors_bitmask_warning & 0x0100) can_mesg[3] |= 0x80;    // Charge Over Current Protection
                          if (errors_bitmask_warning & 0x0800) can_mesg[3] |= 0x08;    // BMS Internal Error
                          if (errors_bitmask_warning & 0x1000) can_mesg[3] |= 0x10;    // UnBalanced Cell
                        }

                        // +---------------------------+
                        // | Flags : byte 4 to 7       |
                        // +---------------------------+

                        can_mesg[4] = id(yambms${yambms_id}_bms_combined).state;     // byte4 - Module in parallel (8bit uint max 255)
                        can_mesg[5] = 0x00;                                    // byte5 - "P" 0x50
                        can_mesg[6] = 0x00;                                    // byte6 - "N" 0x4E
                        can_mesg[7] = 0x00;                                    // byte7

                        // LuxPower
                        // Byte [05:06] : Battery Capacity     (1 Ah)

                        if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_LUXPOWER}) {
                          can_mesg[5] = uint16_t(id(yambms${yambms_id}_battery_capacity).state) & 0xff;
                          can_mesg[6] = uint16_t(id(yambms${yambms_id}_battery_capacity).state) >> 8 & 0xff;
                        }

                        ESP_LOGD("canbus_debug", "send can_id: 0x359 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x35C - Request flag to Enable/Disable: Charge, Discharge ( PYLON / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 6;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35C
                      data: !lambda |-
                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};

                        // Byte [00]    : Request flag
                        // Byte [01]    : Reserved

                        // +--------------------------------+
                        // | Byte 0 : Request flag          |
                        // +--------------------------------+
                        // Bit 3 : Request full charge
                        // if () can_mesg[0] |= 0x8;
                        // Bit 4 : Request force charge 2 (Deye will charge the battery from the grid to the charging voltage specified by the CAN bus and displays `Request Force Charge` on the screen)
                        if (id(yambms${yambms_id}_requested_force_charge).state) can_mesg[0] |= 0x10;
                        // Bit 5 : Request force charge 1 (Deye will charge the battery from the grid to the charging voltage specified by the CAN bus and displays `Request Force Charge` on the screen)
                        // if () can_mesg[0] |= 0x20;
                        // Bit 6 : Discharge enable
                        if (id(yambms${yambms_id}_discharging_instruction).state == true) can_mesg[0] |= 0x40;
                        // Bit 7 : Charge enable
                        if ((id(yambms${yambms_id}_charging_instruction).state == "Bulk") || (id(yambms${yambms_id}_charging_instruction).state == "Float")) can_mesg[0] |= 0x80;

                        // LuxPower
                        // Byte [02:03] : Cycle count     (1 cycle)
                        if (id(canbus${canbus_id}_active_protocol) == ${YB_PROTO_CAN_LUXPOWER}) {
                          can_mesg[2] = uint16_t(id(yambms${yambms_id}_charging_cycles).state) & 0xff;
                          can_mesg[3] = uint16_t(id(yambms${yambms_id}_charging_cycles).state) >> 8 & 0xff;
                        }

                        ESP_LOGD("canbus_debug", "send can_id: 0x35C hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x35A - Protection Alarms and Warning ( SMA / Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 7;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35A
                      data: !lambda |-
                        // Master-LV-communication-guide-EN-8000.pdf
                        // https://github.com/dfch/BydCanProtocol

                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        uint16_t errors_bitmask_alarm = id(yambms${yambms_id}_errors_bitmask_alarm).state;
                        uint16_t errors_bitmask_warning = id(yambms${yambms_id}_errors_bitmask_warning).state;

                        // +---------------------------+
                        // | Alarm : byte 0 to 3       |
                        // +---------------------------+

                        // YamBMS alarm ?
                        if (errors_bitmask_alarm > 0)
                        {
                          if (errors_bitmask_alarm & 0x0001) can_mesg[0] |= 0x0001;    // General alarm
                          if (errors_bitmask_alarm & 0x0002) can_mesg[0] |= 0x0004;    // Battery high voltage alarm
                          if (errors_bitmask_alarm & 0x0004) can_mesg[0] |= 0x0010;    // Battery low voltage alarm
                          if (errors_bitmask_alarm & 0x0008) can_mesg[0] |= 0x0040;    // Battery high temperature alarm
                          if (errors_bitmask_alarm & 0x0010) can_mesg[1] |= 0x0001;    // Battery low temperature alarm
                          if (errors_bitmask_alarm & 0x0020) can_mesg[1] |= 0x0004;    // Battery high temperature charge alarm
                          if (errors_bitmask_alarm & 0x0040) can_mesg[1] |= 0x0010;    // Battery low temperature charge alarm
                          if (errors_bitmask_alarm & 0x0080) can_mesg[1] |= 0x0040;    // Battery high discharge current alarm
                          if (errors_bitmask_alarm & 0x0100) can_mesg[2] |= 0x0001;    // Battery high charge current alarm
                          if (errors_bitmask_alarm & 0x0200) can_mesg[2] |= 0x0004;    // Contactor alarm
                          if (errors_bitmask_alarm & 0x0400) can_mesg[2] |= 0x0010;    // Short circuit alarm
                          if (errors_bitmask_alarm & 0x0800) can_mesg[2] |= 0x0040;    // BMS internal alarm
                          if (errors_bitmask_alarm & 0x1000) can_mesg[3] |= 0x0001;    // Cell imbalance alarm
                        }

                        // +---------------------------+
                        // | Warning : byte 4 to 7     |
                        // +---------------------------+

                        // YamBMS warning ?
                        if (errors_bitmask_warning > 0)
                        {
                          if (errors_bitmask_warning & 0x0001) can_mesg[4] |= 0x0001;    // General warning
                          if (errors_bitmask_warning & 0x0002) can_mesg[4] |= 0x0004;    // Battery high voltage warning
                          if (errors_bitmask_warning & 0x0004) can_mesg[4] |= 0x0010;    // Battery low voltage warning
                          if (errors_bitmask_warning & 0x0008) can_mesg[4] |= 0x0040;    // Battery high temperature warning
                          if (errors_bitmask_warning & 0x0010) can_mesg[5] |= 0x0001;    // Battery low temperature warning
                          if (errors_bitmask_warning & 0x0020) can_mesg[5] |= 0x0004;    // Battery high temperature charge warning
                          if (errors_bitmask_warning & 0x0040) can_mesg[5] |= 0x0010;    // Battery low temperature charge warning
                          if (errors_bitmask_warning & 0x0080) can_mesg[5] |= 0x0040;    // Battery high discharge current warning
                          if (errors_bitmask_warning & 0x0100) can_mesg[6] |= 0x0001;    // Battery high charge current warning
                          if (errors_bitmask_warning & 0x0200) can_mesg[6] |= 0x0004;    // Contactor warning
                          if (errors_bitmask_warning & 0x0400) can_mesg[6] |= 0x0010;    // Short circuit warning
                          if (errors_bitmask_warning & 0x0800) can_mesg[6] |= 0x0040;    // BMS internal warning
                          if (errors_bitmask_warning & 0x1000) can_mesg[7] |= 0x0001;    // Cell imbalance warning
                        }

                        ESP_LOGD("canbus_debug", "send can_id: 0x35A hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x35F - Battery information ( SMA, Victron )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 8;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x35F
                      data: !lambda |-
                        //                SMA                 Victron
                        // Byte [00:01] : Bat-Type            Product ID
                        // Byte [02:03] : BMS Version         Firmware version (2.4 => HEX [02:04])
                        // Byte [04:05] : Bat-Capacity        Available Capacity Ah
                        // Byte [06:07] : Manufacturer ID     Hardware version

                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        can_mesg[2] = 0x02;
                        can_mesg[3] = 0x04;
                        can_mesg[4] = uint16_t(id(yambms${yambms_id}_battery_capacity_remaining).state) & 0xff;
                        can_mesg[5] = uint16_t(id(yambms${yambms_id}_battery_capacity_remaining).state) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x35F hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x70  - Actual Max Cell Temp, Min Cell Temp, Max Cell V, Min Cell V ( SEPLOS V1.0 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 10;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x70
                      data: !lambda |-
                        // Byte [00:01] : Max cell temperature     (0.1 °C)
                        // Byte [02:03] : Min cell temperature     (0.1 °C)
                        // Byte [04:05] : Max cell voltage         (0.1 V)
                        // Byte [06:07] : Min cell voltage         (0.1 V)

                        int max_cell_voltage_i = id(yambms${yambms_id}_max_cell_voltage).state * 100.0;
                        int min_cell_voltage_i = id(yambms${yambms_id}_min_cell_voltage).state * 100.0;

                        uint8_t can_mesg[8];

                        // Added 0.1 °C safeguard to max temperature so that max and min values are never equal
                        can_mesg[0] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) & 0xff;
                        can_mesg[1] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) >> 8 & 0xff;
                        can_mesg[2] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) & 0xff;
                        can_mesg[3] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) >> 8 & 0xff;
                        can_mesg[4] = max_cell_voltage_i & 0xff;
                        can_mesg[5] = max_cell_voltage_i >> 8 & 0xff;
                        can_mesg[6] = min_cell_voltage_i & 0xff;
                        can_mesg[7] = min_cell_voltage_i >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x70 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x371 - Actual Max Cell Temp ID, Min Cell Temp ID, Max Cell V ID, Min Cell ID ( SEPLOS V1.0 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 11;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x371
                      data: !lambda |-
                        // Byte [00:01] : Max cell temperature ID
                        // Byte [02:03] : Min cell temperature ID
                        // Byte [04:05] : Max cell voltage ID
                        // Byte [06:07] : Min cell voltage ID

                        uint8_t can_mesg[8];

                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_max_temperature_sensor).state) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_max_temperature_sensor).state) >> 8 & 0xff;
                        can_mesg[2] = uint16_t(id(yambms${yambms_id}_min_temperature_sensor).state) & 0xff;
                        can_mesg[3] = uint16_t(id(yambms${yambms_id}_min_temperature_sensor).state) >> 8 & 0xff;
                        can_mesg[4] = uint16_t(id(yambms${yambms_id}_max_voltage_cell).state) & 0xff;
                        can_mesg[5] = uint16_t(id(yambms${yambms_id}_max_voltage_cell).state) >> 8 & 0xff;
                        can_mesg[6] = uint16_t(id(yambms${yambms_id}_min_voltage_cell).state) & 0xff;
                        can_mesg[7] = uint16_t(id(yambms${yambms_id}_min_voltage_cell).state) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x371 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x372 - Battery modules information ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 12;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x372
                      data: !lambda |-
                        // Byte [00:01] : Nbr. of battery modules online
                        // Byte [02:03] : Nbr. of modules blocking charge
                        // Byte [04:05] : Nbr. of modules blocking discharge
                        // Byte [06:07] : Nbr. of battery modules offline

                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        can_mesg[0] = id(yambms${yambms_id}_bms_combined).state;
                        can_mesg[2] = id(yambms${yambms_id}_bms_blocking_charge).state;
                        can_mesg[4] = id(yambms${yambms_id}_bms_blocking_discharge).state;
                        can_mesg[6] = (id(yambms${yambms_id}_bms_count).state - id(yambms${yambms_id}_bms_combined).state);

                        ESP_LOGD("canbus_debug", "send can_id: 0x372 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x373 - Actual Min Cell V, Max Cell V, Min Cell Temp (Kelvin), Max Cell Temp (Kelvin) ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 13;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x373
                      data: !lambda |-
                        // Byte [00:01] : Min cell voltage         (1 mV)
                        // Byte [02:03] : Max cell voltage         (1 mV)
                        // Byte [04:05] : Min cell temperature     (1 Kelvin)
                        // Byte [06:07] : Max cell temperature     (1 Kelvin)

                        int min_cell_voltage_i = id(yambms${yambms_id}_min_cell_voltage).state * 1000.0;
                        int max_cell_voltage_i = id(yambms${yambms_id}_max_cell_voltage).state * 1000.0;
                        int min_temp_kelvin = id(yambms${yambms_id}_min_temperature).state + 273.15;
                        int max_temp_kelvin = id(yambms${yambms_id}_max_temperature).state + 273.15;

                        uint8_t can_mesg[8];
                        can_mesg[0] = min_cell_voltage_i & 0xff;
                        can_mesg[1] = min_cell_voltage_i >> 8 & 0xff;
                        can_mesg[2] = max_cell_voltage_i & 0xff;
                        can_mesg[3] = max_cell_voltage_i >> 8 & 0xff;
                        can_mesg[4] = min_temp_kelvin & 0xff;
                        can_mesg[5] = min_temp_kelvin >> 8 & 0xff;
                        can_mesg[6] = max_temp_kelvin & 0xff;
                        can_mesg[7] = max_temp_kelvin >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x373 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x374 - Min cell voltage ID [ASCII] ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 14;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x374
                      data: !lambda |-
                        int cell_id = id(yambms${yambms_id}_min_voltage_cell).state;
                        // init 8 bytes char array values
                        char can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        // save int cell_id to 8 bytes char array
                        snprintf(can_mesg, 8, "%d", cell_id);

                        ESP_LOGD("canbus_debug", "send can_id: 0x374 [ASCII] Min cell voltage ID : %d", cell_id);
                        ESP_LOGD("canbus_debug", "send can_id: 0x374 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x375 - Max cell voltage ID [ASCII] ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 15;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x375
                      data: !lambda |-
                        int cell_id = id(yambms${yambms_id}_max_voltage_cell).state;
                        // init 8 bytes char array values
                        char can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        // save int cell_id to 8 bytes char array
                        snprintf(can_mesg, 8, "%d", cell_id);

                        ESP_LOGD("canbus_debug", "send can_id: 0x375 [ASCII] Max cell voltage ID : %d", cell_id);
                        ESP_LOGD("canbus_debug", "send can_id: 0x375 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x376 - Min cell temperature ID [ASCII] ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 16;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x376
                      data: !lambda |-
                        int sensor_id = id(yambms${yambms_id}_min_temperature_sensor).state;
                        // init 8 bytes char array values
                        char can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        // save int sensor_id to 8 bytes char array
                        snprintf(can_mesg, 8, "%d", sensor_id);

                        ESP_LOGD("canbus_debug", "send can_id: 0x376 [ASCII] Min temperature sensor ID : %d", sensor_id);
                        ESP_LOGD("canbus_debug", "send can_id: 0x376 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x377 - Max cell temperature ID [ASCII] ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 17;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x377
                      data: !lambda |-
                        int sensor_id = id(yambms${yambms_id}_max_temperature_sensor).state;
                        // init 8 bytes char array values
                        char can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        // save int sensor_id to 8 bytes char array
                        snprintf(can_mesg, 8, "%d", sensor_id);

                        ESP_LOGD("canbus_debug", "send can_id: 0x377 [ASCII] Max temperature sensor ID : %d", sensor_id);
                        ESP_LOGD("canbus_debug", "send can_id: 0x377 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x379 - Battery Installed Capacity Ah for Victron, Sol-Ark, LuxPower ( Victron / PYLON V2 )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 19;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x379
                      data: !lambda |-
                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_installed_battery_capacity).state) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_installed_battery_capacity).state) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x379 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x382 - Product identification [ASCII] ( Victron )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 22;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x382
                      data: !lambda |-
                        ESP_LOGD("canbus_debug", "send can_id: 0x382 [ASCII] Product : YamBMS");
                        return {0x59, 0x61, 0x6D, 0x42, 0x4D, 0x53, 0x00, 0x00}; // YamBMS

            - if: # 0x360 - Force charge instruction ( Victron )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 23;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x360
                      data: !lambda |-
                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};

                        // Byte 0 : Force charge instruction
                        if (id(yambms${yambms_id}_requested_force_charge).state) can_mesg[0] = 0xFF;

                        ESP_LOGD("canbus_debug", "send can_id: 0x360 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x359 - Protection and System errors ( Deye PCS )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 24;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x359
                      data: !lambda |-
                        ESP_LOGD("canbus_debug", "send can_id: 0x359 : Protection and System errors (not yet implemented)");
                        return {0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};

            - if: # 0x361 - Actual Max Cell Temp, Min Cell Temp, Max Cell V, Min Cell V ( Deye PCS )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 25;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x361
                      data: !lambda |-
                        // Byte [00:01] : Max cell voltage         (0.001 V)
                        // Byte [02:03] : Min cell voltage         (0.001 V)
                        // Byte [04:05] : Max cell temperature     (0.1 °C)
                        // Byte [06:07] : Min cell temperature     (0.1 °C)

                        int max_cell_voltage_i = id(yambms${yambms_id}_max_cell_voltage).state * 1000.0;
                        int min_cell_voltage_i = id(yambms${yambms_id}_min_cell_voltage).state * 1000.0;

                        uint8_t can_mesg[8];
                        can_mesg[0] = max_cell_voltage_i & 0xff;
                        can_mesg[1] = max_cell_voltage_i >> 8 & 0xff;
                        can_mesg[2] = min_cell_voltage_i & 0xff;
                        can_mesg[3] = min_cell_voltage_i >> 8 & 0xff;
                        // Added 0.1 °C safeguard to max temperature so that max and min values are never equal
                        can_mesg[4] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) & 0xff;
                        can_mesg[5] = int16_t(id(yambms${yambms_id}_max_temperature).state * 10 + 1) >> 8 & 0xff;
                        can_mesg[6] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) & 0xff;
                        can_mesg[7] = int16_t(id(yambms${yambms_id}_min_temperature).state * 10) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x361 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x363 - Software and Hardware version ( Deye PCS )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 26;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x363
                      data: !lambda |-
                        // Byte [00:01] : Software version
                        // Byte [02:03] : Hardware version
                        ESP_LOGD("canbus_debug", "send can_id: 0x363 : Software and Hardware version");
                        // Deye BAT SE-G5.1 Pro-B (EVE 100Ah) reply :
                        return {0x20, 0x08, 0x21, 0x02, 0x00, 0x00, 0x00, 0x00}; // Deye PCS

            - if: # 0x364 - Modules count infos ( Deye PCS )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 27;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x364
                      data: !lambda |-
                        // Byte [00] : Number of battery modules in normal operation
                        // Byte [01] : Number of battery modules blocking charge
                        // Byte [02] : Number of battery modules blocking discharge
                        // Byte [03] : Number of battery modules offline
                        // Byte [04] : Number of battery modules total

                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        can_mesg[0] = id(yambms${yambms_id}_bms_combined).state;
                        can_mesg[1] = id(yambms${yambms_id}_bms_blocking_charge).state;
                        can_mesg[2] = id(yambms${yambms_id}_bms_blocking_discharge).state;
                        can_mesg[3] = (id(yambms${yambms_id}_bms_count).state - id(yambms${yambms_id}_bms_combined).state);
                        can_mesg[4] = id(yambms${yambms_id}_bms_count).state;

                        ESP_LOGD("canbus_debug", "send can_id: 0x364 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};

            - if: # 0x371 - BMS instruction : [ON-GRID] Charge Amps, Discharge Amps ( Deye PCS )
                condition:
                  lambda: return id(canbus${canbus_id}_can_frame) == 28;
                then:
                  - canbus.send:
                      canbus_id: ${canbus_node_id}
                      can_id: 0x371
                      data: !lambda |-
                        // 0x351 => OFF-GRID / 0x371 => ON-GRID
                        // Byte [00:01] = CCL : Charge Limit Current        (0.1 A)
                        // Byte [02:03] = DCL : Discharge Limit Current     (0.1 A)

                        uint8_t can_mesg[] = {0, 0, 0, 0, 0, 0, 0, 0};
                        can_mesg[0] = uint16_t(id(yambms${yambms_id}_requested_charge_current).state * 10) & 0xff;
                        can_mesg[1] = uint16_t(id(yambms${yambms_id}_requested_charge_current).state * 10) >> 8 & 0xff;
                        can_mesg[2] = uint16_t(id(yambms${yambms_id}_requested_discharge_current).state * 10) & 0xff;
                        can_mesg[3] = uint16_t(id(yambms${yambms_id}_requested_discharge_current).state * 10) >> 8 & 0xff;

                        ESP_LOGD("canbus_debug", "send can_id: 0x371 hex: %x %x %x %x %x %x %x %x", can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]);
                        return {can_mesg[0], can_mesg[1], can_mesg[2], can_mesg[3], can_mesg[4], can_mesg[5], can_mesg[6], can_mesg[7]};
