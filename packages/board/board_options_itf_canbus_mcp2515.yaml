# Imported by the package that consumes this CAN node, which passes `canbus_node_id` and
# `canbus_bit_rate`. Optional vars of that import : `mcp2515_spi_id`, `mcp2515_canbus_id`,
# `mcp2515_clock`.

spi:
  - id: ${mcp2515_spi_id | default('mcp2515_spi_bus')}
    mosi_pin: ${spi_mosi_pin}
    miso_pin: ${spi_miso_pin}
    clk_pin: ${spi_clk_pin}
    interface: spi3

canbus:
  - platform: mcp2515
    spi_id: ${mcp2515_spi_id | default('mcp2515_spi_bus')}
    id: ${canbus_node_id}
    cs_pin: ${mcp2515_cs_pin}
    can_id: ${mcp2515_canbus_id | default(2)}
    bit_rate: ${canbus_bit_rate}
    clock: ${mcp2515_clock | default('8MHz')} # Default MCP2515 clock is 8MHz; many boards use 16MHz
