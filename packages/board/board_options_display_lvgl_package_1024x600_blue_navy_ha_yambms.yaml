# Blue Navy YamBMS pages — copy of
#   board_options_display_lvgl_package_800x480_blue_navy_ha_yambms.yaml
# with layout scaled to 1024x600 (same widgets, IDs and HA sensors).

substitutions:
  home_page: 'page_battery'

packages:
  lvgl_design_base:   !include board_options_display_lvgl_design_1024x600_blue_navy_base.yaml
  lvgl_design_yambms: !include board_options_display_lvgl_design_1024x600_blue_navy_yambms.yaml
  ha_sensors_yambms:  !include
    file: board_options_display_lvgl_ha_sensors_blue_navy_yambms.yaml
    vars:
      # Battery fill shell is 125 px at 1024x600 vs 100 px at 800x480.
      battery_fill_px_per_percent: '1.25'
      device_name: ${device_name}
      yambms_name: ${yambms_name}
