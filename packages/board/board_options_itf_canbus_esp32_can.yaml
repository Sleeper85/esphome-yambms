# Imported by the package that consumes this CAN node, which passes `canbus_node_id` and
# `canbus_bit_rate`. Optional var of that import : `esp32_canbus_id`.

canbus:
  - platform: esp32_can
    id: ${canbus_node_id}
    tx_pin: ${tx_pin_4}
    rx_pin: ${rx_pin_4}
    can_id: ${esp32_canbus_id | default(1)}
    bit_rate: ${canbus_bit_rate}
