# Scaled from board_options_display_lvgl_design_800x480_blue_navy_overview.yaml
# for 1024x600 Blue Navy (x*1.28, y*1.25). Same widgets and IDs.

lvgl:

  # ┌──────────────────────────────────────────────────────
  # │ PAGE — OVERVIEW                                     │
  # └──────────────────────────────────────────────────────

  pages:
    - id: page_overview
      bg_color: ${color_bg}
      widgets:

        # ┌──────────────────────────────────────────────────────
        # | DATE AND HOUR
        # └──────────────────────────────────────────────────────

        # ── Date
        - label:
            id: lbl_date
            x: 38
            y: 10
            width: 474
            text: "Wednesday 17"
            text_font: font_28
            text_color: ${color_2}
            text_align: LEFT
        # ── Clock
        - label:
            id: lbl_clock
            x: 512
            y: 10
            width: 474
            text: "06:00"
            text_font: font_28
            text_color: ${color_2}
            text_align: RIGHT

        # ┌──────────────────────────────────────────────────────
        # | SOLAR
        # └──────────────────────────────────────────────────────
        - obj:
            x: 371
            y: 12
            width: 282
            height: 118
            bg_color: ${color_panel}
            border_width: 2
            border_color: ${color_6}
            radius: 15
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 13
                  y: 8
                  width: 256
                  text: "SOLAR"
                  text_font: font_14
                  text_color: ${color_6}
                  text_align: CENTER
              - label:
                  id: lbl_pv_now
                  x: 13
                  y: 28
                  width: 256
                  text: "--- W"
                  text_font: font_22
                  text_color: ${color_1}
                  text_align: CENTER
              - obj:
                  x: 13
                  y: 68
                  width: 256
                  height: 1
                  bg_color: ${color_3}
                  border_width: 0
                  radius: 0
                  scrollbar_mode: "off"
              - label:
                  id: lbl_pv_today
                  x: 13
                  y: 78
                  width: 256
                  text: "Today: --- kWh"
                  text_font: font_14
                  text_color: ${color_6}
                  text_align: CENTER

        # ┌──────────────────────────────────────────────────────
        # | GRID
        # └──────────────────────────────────────────────────────
        - obj:
            x: 38
            y: 148
            width: 256
            height: 182
            bg_color: ${color_panel}
            border_width: 2
            border_color: ${color_2}
            radius: 15
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 13
                  y: 8
                  width: 230
                  text: "GRID"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
              - label:
                  id: lbl_grid_net_now
                  x: 13
                  y: 28
                  width: 230
                  text: "--- W"
                  text_font: font_22
                  text_color: ${color_1}
                  text_align: CENTER

              - label:
                  id: lbl_grid_voltage
                  x: 13
                  y: 62
                  width: 115
                  text: "--- V"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
            #   - label:
            #       id: lbl_grid_free_1
            #       x: 10
            #       y: 70
            #       width: 90
            #       text: "---"
            #       text_font: font_14
            #       text_color: ${color_2}
            #       text_align: CENTER
              - label:
                  id: lbl_grid_frequency
                  x: 128
                  y: 62
                  width: 115
                  text: "--.- Hz"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
            #   - label:
            #       id: lbl_grid_free_2
            #       x: 100
            #       y: 70
            #       width: 90
            #       text: "---"
            #       text_font: font_14
            #       text_color: ${color_2}
            #       text_align: CENTER

              - obj:
                  x: 13
                  y: 119
                  width: 230
                  height: 1
                  bg_color: ${color_3}
                  border_width: 0
                  radius: 0
                  scrollbar_mode: "off"
              - label:
                  x: 13
                  y: 125
                  text: "Daily import:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_grid_import_today
                  x: 109
                  y: 125
                  width: 134
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_7}
                  text_align: RIGHT
              - label:
                  x: 13
                  y: 150
                  text: "Daily export:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_grid_export_today
                  x: 109
                  y: 150
                  width: 134
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_5}
                  text_align: RIGHT

        # ┌──────────────────────────────────────────────────────
        # | BATTERY
        # └──────────────────────────────────────────────────────
        - obj:
            x: 730
            y: 148
            width: 256
            height: 182
            bg_color: ${color_panel}
            border_width: 2
            border_color: ${color_5}
            radius: 15
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 13
                  y: 8
                  width: 230
                  text: "BATTERY"
                  text_font: font_14
                  text_color: ${color_5}
                  text_align: CENTER
              - label:
                  id: lbl_bat_power
                  x: 13
                  y: 28
                  width: 230
                  text: "--- W"
                  text_font: font_22
                  text_color: ${color_1}
                  text_align: CENTER


              - label:
                  id: lbl_bat_soc
                  x: 13
                  y: 62
                  width: 115
                  text: "--- %"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
              - label:
                  id: lbl_bat_charging_phase
                  x: 13
                  y: 88
                  width: 115
                  text: "Float"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
              - label:
                  id: lbl_bat_voltage
                  x: 128
                  y: 62
                  width: 115
                  text: "--.- V"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER
              - label:
                  id: lbl_cell_voltage
                  x: 128
                  y: 88
                  width: 115
                  text: "-.-- Vpc"
                  text_font: font_14
                  text_color: ${color_2}
                  text_align: CENTER

              - obj:
                  x: 13
                  y: 119
                  width: 230
                  height: 1
                  bg_color: ${color_3}
                  border_width: 0
                  radius: 0
                  scrollbar_mode: "off"
              - label:
                  x: 13
                  y: 125
                  text: "Daily charge:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_bat_charge_today
                  x: 115
                  y: 125
                  width: 128
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_4}
                  text_align: RIGHT
              - label:
                  x: 13
                  y: 150
                  text: "Daily discharge:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_bat_discharge_today
                  x: 115
                  y: 150
                  width: 128
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_5}
                  text_align: RIGHT

        # ┌──────────────────────────────────────────────────────
        # | HOME
        # └──────────────────────────────────────────────────────
        - obj:
            x: 371
            y: 348
            width: 282
            height: 190
            bg_color: ${color_panel}
            border_width: 2
            border_color: ${color_4}
            radius: 15
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 13
                  y: 8
                  width: 256
                  text: "HOME"
                  text_font: font_14
                  text_color: ${color_4}
                  text_align: CENTER
              - label:
                  id: lbl_home_now
                  x: 13
                  y: 28
                  width: 256
                  text: "--- W"
                  text_font: font_22
                  text_color: ${color_1}
                  text_align: CENTER
              - obj:
                  x: 13
                  y: 68
                  width: 256
                  height: 1
                  bg_color: ${color_3}
                  border_width: 0
                  radius: 0
                  scrollbar_mode: "off"
              - label:
                  x: 13
                  y: 78
                  text: "Today:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_home_daily_energy_total
                  x: 122
                  y: 78
                  width: 147
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_4}
                  text_align: RIGHT
              - label:
                  x: 13
                  y: 102
                  text: "Solar:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_home_daily_energy_solar
                  x: 122
                  y: 102
                  width: 147
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_6}
                  text_align: RIGHT
              - label:
                  x: 13
                  y: 128
                  text: "Grid:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_home_daily_energy_grid
                  x: 122
                  y: 128
                  width: 147
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_7}
                  text_align: RIGHT
              - label:
                  x: 13
                  y: 152
                  text: "Battery:"
                  text_font: font_14
                  text_color: ${color_2}
              - label:
                  id: lbl_home_daily_energy_bat
                  x: 122
                  y: 152
                  width: 147
                  text: "--- kWh"
                  text_font: font_14
                  text_color: ${color_5}
                  text_align: RIGHT

        # ┌──────────────────────────────────────────────────────
        # | CONNECTION LINES — Junction
        # └──────────────────────────────────────────────────────

        # Line Solar (vertical, yellow)
        - obj:
            id: line_solar
            x: 511
            y: 130
            width: 3
            height: 106
            bg_color: ${color_6}
            border_width: 0
            radius: 0
            scrollbar_mode: "off"

        # Line Grid (horizontal, grey)
        - obj:
            id: line_grid
            x: 294
            y: 238
            width: 215
            height: 2
            bg_color: ${color_2}
            border_width: 0
            radius: 0
            scrollbar_mode: "off"

        # Line Battery (horizontal, green)
        - obj:
            id: line_battery
            x: 515
            y: 238
            width: 215
            height: 2
            bg_color: ${color_5}
            border_width: 0
            radius: 0
            scrollbar_mode: "off"

        # Line Home (vertical, light blue)
        - obj:
            id: line_home
            x: 511
            y: 240
            width: 3
            height: 108
            bg_color: ${color_4}
            border_width: 0
            radius: 0
            scrollbar_mode: "off"

        # Junction circle
        # Outer ring
        - obj:
            x: 481
            y: 209
            width: 61
            height: 60
            bg_color: ${color_panel}
            border_width: 2
            border_color: ${color_1}
            radius: 30
            scrollbar_mode: "off"
        # Inner dot
        # - obj:
        #     x: 394
        #     y: 185
        #     width: 12
        #     height: 12
        #     bg_color: ${color_1}
        #     border_width: 0
        #     radius: 6
        #     scrollbar_mode: "off"

        # ┌──────────────────────────────────────────────────────
        # | ANIMATED DOTS — 1 per line, color = block border color
        # └──────────────────────────────────────────────────────

        # Solar dot (yellow)
        - obj:
            id: dot_solar
            x: 506
            y: 156
            width: 13
            height: 12
            bg_color: ${color_6}
            border_width: 0
            radius: 6
            scrollbar_mode: "off"

        # Grid dot (grey, hidden by default)
        - obj:
            id: dot_grid
            x: 384
            y: 232
            width: 13
            height: 12
            bg_color: ${color_2}
            border_width: 0
            radius: 6
            scrollbar_mode: "off"

        # Battery dot (green, hidden by default)
        - obj:
            id: dot_bat
            x: 640
            y: 232
            width: 13
            height: 12
            bg_color: ${color_5}
            border_width: 0
            radius: 6
            scrollbar_mode: "off"

        # Home dot (light blue)
        - obj:
            id: dot_home
            x: 506
            y: 312
            width: 13
            height: 12
            bg_color: ${color_4}
            border_width: 0
            radius: 6
            scrollbar_mode: "off"
