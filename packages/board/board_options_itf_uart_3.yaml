# Imported by the package that consumes this UART, which passes `uart_baud_rate`.

uart:
  - id: uart_3
    tx_pin: ${tx_pin_3}
    rx_pin: ${rx_pin_3}
    baud_rate: ${uart_baud_rate}
    rx_buffer_size: ${uart_rx_buffer_size | default(256)}
