  - title: Diagnostic
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: |-
              {%- set raw = states('sensor.yambms_board_system_fault_data') %}
              {%- set names = ['API / MQTT', 'BMS', 'CAN->INV', 'RS485->INV', 'Shunt', 'Balancer', 'Network', 'Aux 1', 'Cat 8', 'Cat 9', 'Cat 10', 'Cat 11', 'Cat 12', 'Cat 13', 'Cat 14', 'Cat 15'] %}
              {%- if raw in ['unknown', 'unavailable', 'none', ''] %}
              Initializing...
              {%- else %}
              {%- set data = raw | from_json %}
              | Component | Instance status |
              | :--- | :--- |
              {%- for cat_idx in range(0, 16) %}
              {%- if data | count > cat_idx and data[cat_idx] | count > 0 %}
              {%- set ns = namespace(visual='') %}
              {%- for inst in data[cat_idx] %}
              {%- set icon = '❌' if inst == 1 else ('✅' if inst == 0 else '➖') %}
              {%- set ns.visual = ns.visual ~ icon ~ ' ' %}
              {%- endfor %}
              | {{ names[cat_idx] }} | {{ ns.visual }} |
              {%- endif %}
              {%- endfor %}
              {%- endif %}
            title: 🚨 YamBMS - Fault status
          - type: markdown
            content: |2
                <table>
                <tr>
                  <td>Node ID hash</td>
                  <td>{{ states('sensor.yambms_board_node_id_hash') }}</td>
                </tr>
                <tr>
                  <td>MAC address</td>
                  <td>{{ states('sensor.yambms_board_mac_address') }}</td>
                </tr>
                <tr>
                  <td>IP address</td>
                  <td>{{ states('sensor.yambms_board_ip_address') }}</td>
                </tr>
                </table>
            title: 🌐 YamBMS - Network
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            title: 🔍 YamBMS - Diagnostic
            content: |2
                <table>
                <tr>
                  <td>Chip</td>
                  <td>{% set info = states('sensor.yambms_board_debug_device_info') %}{% if info not in ['unknown', 'unavailable', ''] and '|' in info %}{{ info.split('|')[1].split('Features:')[0].replace('Chip:', '').strip() }}{% else %}{{ info }}{% endif %}</td>
                </tr>
                <tr>
                  <td>Board Uptime</td>
                  <td>{{ states('sensor.yambms_board_uptime') }}</td>
                </tr>
                <tr>
                  <td>Entities</td>
                  <td>{{ integration_entities(config_entry_attr(config_entry_id('sensor.yambms_board_uptime'), 'title')) | count }}</td>
                </tr>
                <tr>
                  <td>PSRAM</td>
                  <td>{% set psram = states('sensor.yambms_board_debug_free_psram') %}{% if psram|float(0) > 0 %}<font color="#4CAF50">Active — {{ states('sensor.yambms_board_debug_free_psram_percent')|float|round }} % free</font>{% else %}Not active{% endif %}</td>
                </tr>
                <tr>
                  <td>Debug Free PSRAM (%)</td>
                  <td>{{ states('sensor.yambms_board_debug_free_psram_percent')|float(0)|round }} %</td>
                </tr>
                <tr>
                  <td>Debug Free PSRAM</td>
                  <td>{{ states('sensor.yambms_board_debug_free_psram')|float(0)|round }} B</td>
                </tr>
                <tr>
                  <td>Debug Heap free (%)</td>
                  <td>{{ states('sensor.yambms_board_debug_heap_free_percent')|float(0)|round }} %</td>
                </tr>
                <tr>
                  <td>Debug Heap free</td>
                  <td>{{ states('sensor.yambms_board_debug_heap_free')|float(0)|round }} B</td>
                </tr>
                <tr>
                  <td>Debug Heap max block (%)</td>
                  <td>{{ states('sensor.yambms_board_debug_heap_max_block_percent')|float(0)|round }} %</td>
                </tr>
                <tr>
                  <td>Debug Heap max block</td>
                  <td>{{ states('sensor.yambms_board_debug_heap_max_block')|float(0)|round }} B</td>
                </tr>
                <tr>
                  <td>Debug Loop time</td>
                  <td>{{ states('sensor.yambms_board_debug_loop_time')|float(0)|round }} ms</td>
                </tr>
                <tr>
                  <td>Debug Reset reason</td>
                  <td>{{ states('sensor.yambms_board_debug_reset_reason') }}</td>
                </tr>
                <tr>
                  <td>YamBMS Running version</td>
                  <td>{{ states('sensor.yambms_1_running_version') }}</td>
                </tr>
                <tr>
                  <td>YamBMS Last version</td>
                  <td>{{ states('sensor.yambms_1_last_version') }}</td>
                </tr>
                <tr>
                  <td>ESPHome version</td>
                  <td>{{ states('sensor.yambms_board_esphome_version')[:8] }}</td>
                </tr>
                </table>
      - type: grid
        column_span: 1
        cards:
          - type: entity-filter
            entities:
              - entity: binary_sensor.yambms_1_canbus_1_status
                name: CANBUS Status
              - entity: switch.yambms_1_canbus_1_inverter_heartbeat_monitoring
                name: CANBUS Inverter Heartbeat Monitoring
              - entity: sensor.yambms_1_canbus_1_inverter_heartbeat
                name: CANBUS Inverter Heartbeat
              - entity: binary_sensor.yambms_1_rs485_1_status
                name: RS485 Status
              - entity: switch.yambms_1_rs485_1_inverter_heartbeat_monitoring
