views:
  - title: YamBMS
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🔋 YamBMS - Battery
            heading_style: title
          - graph: line
            type: sensor
            entity: sensor.yambms_1_total_voltage
            detail: 2
            layout_options:
              grid_columns: 2
              grid_rows: 2
            name: Voltage
            hours_to_show: 8
          - graph: line
            type: sensor
            entity: sensor.yambms_1_battery_soc
            detail: 2
            name: SoC
            hours_to_show: 8
          - type: gauge
            entity: sensor.yambms_1_current
            needle: true
            severity:
              green: 0
              yellow: -250
              red: -500
            max: 500
            min: -500
            name: Current
            layout_options:
              grid_columns: 2
              grid_rows: 3
          - type: gauge
            entity: sensor.yambms_1_power
            needle: true
            severity:
              green: 0
              yellow: -5000
              red: -10000
            max: 10000
            min: -10000
            name: Power
            layout_options:
              grid_columns: 2
              grid_rows: 3
          - type: tile
            entity: sensor.yambms_1_installed_battery_capacity
            name: Installed Battery Capacity
          - type: tile
            entity: sensor.yambms_1_battery_soh
            name: Battery SoH
          - type: tile
            entity: sensor.yambms_1_battery_capacity
            name: Battery Capacity
          - type: tile
            entity: sensor.yambms_1_capacity_remaining
            name: Capacity Remaining
          - type: tile
            entity: sensor.yambms_1_delta_cell_voltage
            name: Delta Cell Voltage
          - type: tile
            entity: binary_sensor.yambms_1_equalizing_state
            name: Equalizing state
          - type: entities
            entities:
              - entity: sensor.yambms_1_max_cell_voltage
                name: Max Cell V.
              - entity: sensor.yambms_1_max_voltage_cell
                name: Cell number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_1_min_cell_voltage
                name: Min Cell V.
              - entity: sensor.yambms_1_min_voltage_cell
                name: Cell number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_1_max_temperature
                name: Max temp.
              - entity: sensor.yambms_1_max_temperature_sensor
                name: Sensor number
            layout_options:
              grid_columns: 2
              grid_rows: 2
          - type: entities
            entities:
              - entity: sensor.yambms_1_min_temperature
                name: Min temp.
              - entity: sensor.yambms_1_min_temperature_sensor
                name: Sensor number
            layout_options:
              grid_columns: 2
              grid_rows: 2
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 📟  YamBMS - Status
            heading_style: title
          - type: tile
            entity: binary_sensor.yambms_1_inverter_communication_status
            name: Inverter comm. status
          - type: tile
            entity: binary_sensor.yambms_board_online_status
            name: Board status
          - type: tile
            entity: sensor.yambms_1_charging_status
            name: Charging Status
          - type: tile
            entity: sensor.yambms_1_last_complete_charge
            name: Last Complete Charge
          - type: tile
            entity: sensor.yambms_1_charging_instruction
            name: Charging Instruction
          - type: tile
            entity: binary_sensor.yambms_1_discharging_instruction
            name: Discharging Instruction
          - type: tile
            entity: sensor.yambms_1_alarm
            name: Alarm
          - type: tile
            entity: sensor.yambms_1_warning
            name: Warning
          - type: entities
            entities:
              - entity: sensor.yambms_1_bms_count
                name: BMS count
              - entity: sensor.yambms_1_bms_combined
                name: BMS combined
              - entity: sensor.yambms_1_bms_blocking_charge
                name: BMS blocking charge
              - entity: sensor.yambms_1_bms_blocking_discharge
                name: BMS blocking discharge
              - entity: sensor.yambms_1_bms_in_alarm
                name: BMS in alarm
            layout_options:
              grid_columns: 2
              grid_rows: 4
          - type: entities
            entities:
              - entity: sensor.yambms_1_shunt_count
                name: Shunt count
              - entity: sensor.yambms_1_shunt_combined
                name: Shunt combined
            grid_options:
              columns: 6
              rows: 4
          - type: entities
            entities:
              - entity: sensor.yambms_1_requested_charge_voltage
                name: Requested Charge Voltage
              - entity: sensor.yambms_1_requested_charge_current
                name: Requested Charge Current
              - entity: sensor.yambms_1_requested_discharge_voltage
                name: Requested Discharge Voltage
              - entity: sensor.yambms_1_requested_discharge_current
                name: Requested Discharge Current
              - entity: binary_sensor.yambms_1_requested_force_charge
                name: Requested Force Charge
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: 📋 YamBMS - Overview
            heading_style: title
          - type: markdown
            content: |-
              {% set on = '<font color="#4CAF50"><b>ON</b></font>' %}
              {% set off = '<font color="#9e9e9e">OFF</font>' %}
              <table>
                <tr>
                  <td>CCL Derating Reason</td>
                  <td>{% set v = states('sensor.yambms_1_ccl_derating_reason') %}{% if v == 'No Derating' %}<font color="#4CAF50">{{ v }}</font>{% else %}<font color="#FFC107">{{ v }}</font>{% endif %} — {{ states('sensor.yambms_1_requested_charge_current')|float|round }} A</td>
                </tr>
                <tr>
                  <td>DCL Derating Reason</td>
                  <td>{% set v = states('sensor.yambms_1_dcl_derating_reason') %}{% if v == 'No Derating' %}<font color="#4CAF50">{{ v }}</font>{% else %}<font color="#FFC107">{{ v }}</font>{% endif %} — {{ states('sensor.yambms_1_requested_discharge_current')|float|round }} A</td>
                </tr>
                {% if is_state('switch.yambms_1_temperature_based_current_limitation','on') %}
                <tr>
                  <td>Temp. Based Current Limit</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_1_automatic_charge_voltage','on') %}
                <tr>
                  <td>Automatic Charge Voltage</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_1_automatic_charge_current','on') %}
                <tr>
                  <td>Automatic Charge Current</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_1_automatic_discharge_current','on') %}
                <tr>
                  <td>Automatic Discharge Current</td>
                  <td>{{ on }}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_1_automatic_eoc_current','on') %}
                <tr>
                  <td>Automatic EOC Current</td>
                  <td>{% set eoc_status = states('sensor.yambms_1_auto_eoc_status') %}{% set eoc_val %}{{ states('number.yambms_1_auto_eoc_target_hour') | int }}:{{ '%02d' % (states('number.yambms_1_auto_eoc_target_minute') | int) }} — {{ eoc_status }}{% endset %}{% if eoc_status.startswith('Stop:') %}<font color="#FFC107">{{ eoc_val }}</font>{% elif eoc_status.startswith('Run') %}<font color="#4CAF50">{{ eoc_val }}</font>{% else %}{{ eoc_val }}{% endif %}</td>
                </tr>
                {% endif %}
                {% if is_state('switch.yambms_1_automatic_soc_limit','on') %}
                <tr>
                  <td>Automatic SoC Limit</td>
                  <td>{% set soc_status = states('sensor.yambms_1_auto_soc_limit_status') %}{% if soc_status.startswith('Stop:') %}<font color="#FFC107">{{ states('number.yambms_1_auto_soc_limit') }} % — {{ soc_status }}</font>{% elif soc_status == 'Run' %}<font color="#4CAF50">{{ states('number.yambms_1_auto_soc_limit') }} % — {{ soc_status }}</font>{% else %}{{ states('number.yambms_1_auto_soc_limit') }} % — {{ soc_status }}{% endif %}</td>
                </tr>
                {% endif %}
                {% set rebulk_days = states('number.yambms_1_rebulk_days') | int %}
                {% if rebulk_days != 0 %}
                <tr>
                  <td>Rebulk Days</td>
                  <td>{% set last = strptime(states('sensor.yambms_1_last_complete_charge') | trim, '%H:%M %d %b %Y') %}{% set remaining = (last.date() + timedelta(days=rebulk_days) - now().date()).days %}{{ rebulk_days }} days — {% if remaining < 0 %}<font color="#F44336">{{ remaining | abs }} overdue</font>{% elif remaining == 0 %}<font color="#F44336">{{ remaining }} remaining</font>{% elif remaining <= 2 %}<font color="#FFC107">{{ remaining }} remaining</font>{% else %}<font color="#4CAF50">{{ remaining }} remaining</font>{% endif %}</td>
                </tr>
                {% endif %}
                <tr>
                  <td>Rebulk SoC</td>
                  <td>{{ states('number.yambms_1_rebulk_soc')|float|round }} %</td>
                </tr>
                <tr>
                  <td>Rebulk Voltage</td>
                  <td>{{ states('number.yambms_1_rebulk_v')|float|round(2) }} V</td>
                </tr>
                </table>
          - type: heading
            heading: 🚨 YamBMS - Fault status
            heading_style: title
          - type: markdown
            content: |-
              {%- set raw = states('sensor.yambms_board_system_fault_data') %}
              {%- set names = ['API / MQTT', 'BMS', 'CAN->INV', 'RS485->INV', 'Shunt', 'Balancer', 'Network', 'Aux 1', 'Cat 8', 'Cat 9', 'Cat 10', 'Cat 11', 'Cat 12', 'Cat 13', 'Cat 14', 'Cat 15'] %}
              {%- if raw in ['unknown', 'unavailable', 'none', ''] %}
              Initializing...
              {%- else %}
              {%- set data = raw | from_json %}
              | Component | Instance status |
              | :--- | :--- |
              {%- for cat_idx in range(0, 16) %}
              {%- if data | count > cat_idx and data[cat_idx] | count > 0 %}
              {%- set ns = namespace(visual='') %}
              {%- for inst in data[cat_idx] %}
              {%- set icon = '❌' if inst == 1 else ('✅' if inst == 0 else '➖') %}
              {%- set ns.visual = ns.visual ~ icon ~ ' ' %}
              {%- endfor %}
              | {{ names[cat_idx] }} | {{ ns.visual }} |
              {%- endif %}
              {%- endfor %}
              {%- endif %}
          - type: heading
            heading: 🔍 YamBMS - Diagnostic
            heading_style: title
          - type: markdown
            content: |2
                <table>
                <tr>
                  <td>Chip</td>
                  <td>{% set info = states('sensor.yambms_board_debug_device_info') %}{% if info not in ['unknown', 'unavailable', ''] and '|' in info %}{{ info.split('|')[1].split('Features:')[0].replace('Chip:', '').strip() }}{% else %}{{ info }}{% endif %}</td>
                </tr>
                <tr>
                  <td>Board Uptime</td>
                  <td>{{ states('sensor.yambms_board_uptime') }}</td>
                </tr>
                <tr>
                  <td>Entities</td>
                  <td>{{ integration_entities(config_entry_attr(config_entry_id('sensor.yambms_board_uptime'), 'title')) | count }}</td>
                </tr>
                <tr>
                  <td>Loop Time</td>
                  <td>{{ states('sensor.yambms_board_debug_loop_time')|float|round }} ms</td>
                </tr>
                  <tr>
                  <td>Heap Free Memory</td>
                  <td>{{ states('sensor.yambms_board_debug_heap_free_percent')|float|round }} %</td>
                </tr>
                <tr>
                  <td>PSRAM</td>
                  <td>{% set psram = states('sensor.yambms_board_debug_free_psram') %}{% if psram|float(0) > 0 %}<font color="#4CAF50">Active — {{ states('sensor.yambms_board_debug_free_psram_percent')|float|round }} % free</font>{% else %}Not active{% endif %}</td>
                </tr>
                <tr>
                  <td>YamBMS Running version</td>
                  <td>{{ states('sensor.yambms_1_running_version') }}</td>
                </tr>
                <tr>
                  <td>YamBMS Last version</td>
                  <td>{{ states('sensor.yambms_1_last_version') }}</td>
                </tr>
                <tr>
                  <td>ESPHome Version</td>
                  <td>{{ states('sensor.yambms_board_esphome_version')[:8] }}</td>
                </tr>
              </table>
  - title: Settings
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: entity-filter
            entities:
              - entity: select.yambms_1_canbus_1_inverter_brand
                name: CANBUS 1 Inverter brand
              - entity: select.yambms_1_canbus_1_protocol
                name: CANBUS 1 Protocol
              - entity: select.yambms_1_canbus_2_inverter_brand
                name: CANBUS 2 Inverter brand
              - entity: select.yambms_1_canbus_2_protocol
                name: CANBUS 2 Protocol
              - entity: select.yambms_1_canbus_3_inverter_brand
                name: CANBUS 3 Inverter brand
              - entity: select.yambms_1_canbus_3_protocol
                name: CANBUS 3 Protocol
              - entity: select.yambms_1_rs485_1_inverter_brand
                name: RS485 1 Inverter brand
              - entity: select.yambms_1_rs485_1_protocol
                name: RS485 1 Protocol
              - entity: select.yambms_1_rs485_2_inverter_brand
                name: RS485 2 Inverter brand
              - entity: select.yambms_1_rs485_2_protocol
                name: RS485 2 Protocol
              - entity: select.yambms_1_rs485_3_inverter_brand
                name: RS485 3 Inverter brand
              - entity: select.yambms_1_rs485_3_protocol
                name: RS485 3 Protocol
            conditions:
              - condition: state
                state_not: unavailable
            card:
              title: YamBMS - Inverter protocol
          - type: markdown
            title: YamBMS - Inverter active protocol
            content: |-
              {% set links = [
                ('CANBUS 1', 'sensor.yambms_1_canbus_1_inverter_link_protocol', 'binary_sensor.yambms_1_canbus_1_status'),
                ('CANBUS 2', 'sensor.yambms_1_canbus_2_inverter_link_protocol', 'binary_sensor.yambms_1_canbus_2_status'),
                ('CANBUS 3', 'sensor.yambms_1_canbus_3_inverter_link_protocol', 'binary_sensor.yambms_1_canbus_3_status'),
                ('RS485 1', 'sensor.yambms_1_rs485_1_inverter_link_protocol', 'binary_sensor.yambms_1_rs485_1_status'),
                ('RS485 2', 'sensor.yambms_1_rs485_2_inverter_link_protocol', 'binary_sensor.yambms_1_rs485_2_status'),
                ('RS485 3', 'sensor.yambms_1_rs485_3_inverter_link_protocol', 'binary_sensor.yambms_1_rs485_3_status') ] %}
              {%- for label, e, s in links %}
              {%- set p = states(e) %}
              {%- if p not in ['unknown', 'unavailable'] %}
              {%- set m = states(e | replace('inverter_link_protocol', 'inverter_battery_mode')) %}
              {%- set n = states(e | replace('inverter_link_protocol', 'note')) %}
              {%- set st = states(s) %}
              {%- set link = label ~ (' - ON' if st == 'on' else (' - OFF' if st == 'off' else '')) %}
              
              **{{ link }} :**
              * {{ p }}
              {%- if m not in ['unknown', 'unavailable', ''] %}
              {%- if m == 'See inverter manual' %}
              * {{ m }}
              {%- else %}
              * Set your inverter battery mode to **{{ m }}**
              {%- endif %}
              {%- endif %}
              {%- if n not in ['unknown', 'unavailable', ''] %}
              * {{ n }}
              {%- endif %}
              {%- endif %}
              {%- endfor %}
          - type: entities
            entities:
              - entity: switch.yambms_1_charge_enabled
                name: Charge enabled
              - entity: switch.yambms_1_discharge_enabled
                name: Discharge enabled
              - entity: binary_sensor.yambms_1_charging_allowed
                name: Charging allowed
              - entity: binary_sensor.yambms_1_discharging_allowed
                name: Discharging allowed
            title: YamBMS - Charge / Discharge switch
            show_header_toggle: false
          - type: entities
            entities:
              - entity: switch.yambms_1_request_force_charge
                name:
                  type: entity
              - entity: number.yambms_1_request_force_charge_start_soc
                name: Start SoC
              - entity: number.yambms_1_request_force_charge_stop_soc
                name: Stop SoC
              - entity: binary_sensor.yambms_1_requested_force_charge
                name:
                  type: entity
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#request-force-charge
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Request force charge
      - type: grid
        column_span: 1
        cards:
          - type: entities
            entities:
              - entity: sensor.yambms_1_charging_status
                name:
                  type: entity
              - entity: sensor.yambms_1_charging_instruction
                name:
                  type: entity
              - entity: switch.yambms_1_float_charge_enabled
                name:
                  type: entity
              - entity: switch.yambms_1_eoc_timer_enabled
                name:
                  type: entity
              - entity: number.yambms_1_bulk_voltage
                name:
                  type: entity
              - entity: number.yambms_1_float_voltage
                name:
                  type: entity
              - entity: number.yambms_1_charger_offset_v
                name:
                  type: entity
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#charging-settings
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Charging Settings
            show_header_toggle: false
          - type: entities
            entities:
              - entity: sensor.yambms_1_requested_charge_voltage
                name: Requested Charge Voltage
              - entity: sensor.yambms_1_requested_discharge_voltage
                name: Requested Discharge Voltage
              - entity: sensor.yambms_1_requested_charge_current
                name: Requested Charge Current
              - entity: sensor.yambms_1_requested_discharge_current
                name: Requested Discharge Current
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#requested-values
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Requested Values
      - type: grid
        column_span: 1
        cards:
          - type: entities
            entities:
              - entity: number.yambms_1_max_requested_charge_current
                name: Max charge current
              - entity: number.yambms_1_max_requested_discharge_current
                name: Max discharge current
              - entity: number.yambms_1_max_charge_c_rate
                name:
                  type: entity
              - entity: number.yambms_1_max_discharge_c_rate
                name:
                  type: entity
              - entity: switch.yambms_1_temperature_based_current_limitation
                name:
                  type: entity
              - entity: sensor.yambms_1_ccl_derating_reason
                name:
                  type: entity
              - entity: sensor.yambms_1_dcl_derating_reason
                name:
                  type: entity
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#max-requested-current
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Max requested current
          - type: entities
            entities:
              - entity: number.yambms_1_rebulk_soc
                name:
                  type: entity
              - entity: number.yambms_1_rebulk_v
                name:
                  type: entity
              - entity: number.yambms_1_rebulk_days
                name:
                  type: entity
              - entity: switch.yambms_1_force_bulk
                name:
                  type: entity
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#rebulk
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - ReBulk
  - title: Auto Functions
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: entities
            entities:
              - entity: switch.yambms_1_automatic_charge_voltage
                name: Automatic Charge Voltage
              - entity: number.yambms_1_auto_cvl_boost_charge_v
                name: Auto CVL Boost Charge V.
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#auto-cvl
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Auto CVL
          - type: entities
            entities:
              - entity: select.yambms_1_automatic_float_voltage
                name: Automatic Float Voltage
              - entity: sensor.yambms_1_auto_float_voltage
                name: Auto Float Voltage
              - entity: number.yambms_1_auto_float_update_interval
                name: Update Interval
              - entity: number.yambms_1_auto_float_voltage_step
                name: Voltage Step
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#auto-float-voltage
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Auto Float Voltage
      - type: grid
        column_span: 1
        cards:
          - type: entities
            entities:
              - entity: switch.yambms_1_automatic_charge_current
                name: Automatic Charge Current
              - entity: switch.yambms_1_automatic_discharge_current
                name: Automatic Discharge Current
              - type: weblink
                url: >-
                  https://github.com/Sleeper85/esphome-yambms/blob/main/documents/README/YamBMS_functions.md#auto-ccl--dcl
                name: README
                icon: mdi:book-open-variant
            title: YamBMS - Auto CCL / DCL
            show_header_toggle: false
          - type: entities
            title: Auto CCL - Current Taper
            show_header_toggle: false
            entities:
              - entity: switch.yambms_1_auto_ccl_current_taper
                name: Current Taper
              - type: conditional
                conditions:
                  - entity: switch.yambms_1_auto_ccl_current_taper
                    state: "on"
                row:
                  entity: number.yambms_1_auto_ccl_ct_knee_voltage
                  name: Knee Voltage
              - type: conditional
                conditions:
                  - entity: switch.yambms_1_auto_ccl_current_taper
                    state: "on"
                row:
                  entity: number.yambms_1_auto_ccl_ct_knee_c_rate
                  name: Knee C-Rate
              - type: conditional
                conditions:
                  - entity: switch.yambms_1_auto_ccl_current_taper
                    state: "on"
                row:
                  entity: sensor.yambms_1_auto_ccl_ct_knee_amps
                  name: Knee Amps
              - type: conditional
                conditions:
                  - entity: switch.yambms_1_auto_ccl_current_taper
                    state: "on"
                row:
                  entity: number.yambms_1_auto_ccl_ct_bulk_c_rate
                  name: Bulk C-Rate
              - type: conditional
                conditions:
                  - entity: switch.yambms_1_auto_ccl_current_taper
                    state: "on"
                row:
